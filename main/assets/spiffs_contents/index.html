<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>幸运翻页机</title>
<style>
/* 页面特有样式；通用组件（body/.card/button/input/.note/.row…）统一走 app.css 基础层 */
.card{text-align:center}                 /* 抽奖页卡片内容居中 */
#state{font-size:14px;margin-bottom:12px}
#state .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.st-idle .dot{background:var(--g)}.st-spinning .dot,.st-printing .dot{background:var(--w);animation:pulse 1s infinite}
.st-homing .dot,.st-boot .dot{background:var(--w);animation:pulse 2s infinite}
.st-homing_failed .dot,.st-out_of_prizes .dot{background:var(--p)}
@keyframes pulse{50%{opacity:.3}}
/* 抽奖大按钮：形状是页面特例，颜色/字重沿用统一令牌 */
#draw{width:200px;height:200px;border-radius:50%;border:none;background:var(--p);color:#fff;font-size:32px;font-weight:bold;cursor:pointer;transition:transform .1s;box-shadow:0 8px 30px rgba(232,67,63,.4)}
#draw:active{transform:scale(.95)}
#draw:disabled{background:#555;cursor:not-allowed;box-shadow:none}
#last{margin-top:14px;font-size:15px;line-height:1.8}
#last .prize{font-size:26px;font-weight:bold;color:#ffd700}
.stats{display:flex;justify-content:center;gap:24px;margin-top:12px;font-size:13px;color:#aaa}
.fault{background:#5c1a1a;border:1px solid var(--p);border-radius:var(--r-ctl);padding:10px;margin-bottom:12px;display:none;font-size:13px}
@keyframes roll{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
#draw.rolling{background:var(--p-dark);animation:roll 1.2s linear infinite}
</style>
<!-- 移动端统一样式（安全区/44px 触控/16px 输入框/固定操作栏）：必须在各页内联样式之后 -->
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav><a href="/index.html">抽奖</a><a href="/prizes.html">奖池</a><a href="/receipt.html">小票</a><a href="/logo.html">Logo</a><a href="/calibrate.html">标定</a><a href="/wifi.html">WiFi</a></nav>
<div class="fault" id="fault">⚠ 打印机异常：请检查纸张与连线（连续失败 ≥3 次）</div>
<div class="card">
  <div id="state"><span class="dot"></span><span id="stateText">连接中…</span></div>
  <button id="draw" onclick="draw()">抽奖</button>
  <div id="last"></div>
  <div class="stats"><span>累计 <b id="total">0</b></span><span>今日 <b id="today">0</b></span></div>
  <button class="mini" onclick="testTicket()">打印测试票</button>
</div>
<script>
const $=s=>document.querySelector((s[0]==='#'||s[0]==='.')?s:('#'+s));
const ST={boot:'启动中…',homing:s=>`正在归零，请稍候${s&&s<15?'（约 '+Math.ceil(s)+'s）':''}…`,homed:'就绪',
homing_failed:'归零失败：请检查机械/接线后重启',idle:'就绪，可开奖',spinning:'翻页中…',
printing:'打印小票中…',done:'开奖完成',out_of_prizes:'奖品已发完（等待补货或重置库存）',unknown:'…'};
let rolling=false;
async function poll(){
  try{
    const r=await fetch('/api/lottery/status');const d=await r.json();
    $('#state').className='st-'+d.state;
    const f=ST[d.state]||d.state;
    $('#stateText').textContent=typeof f==='function'?f(12):f;
    $('#fault').style.display=d.printer_fault?'block':'none';
    $('#total').textContent=(d.stats&&d.stats.total_draws!=null)?d.stats.total_draws:0;
    $('#today').textContent=(d.stats&&d.stats.today_draws!=null)?d.stats.today_draws:0;
    if(d.last&&d.last.ticket){
      const p=d.last.print==='ok'?'已打印':d.last.print==='failed'?'打印失败':'未打印';
      $('#last').innerHTML=`<div class="prize">${d.last.prize_name||''}</div>
      <div>${d.last.ticket||''} · ${d.last.time||''} · ${p}</div>`;
    }
    const can=d.state==='idle'||d.state==='done';
    $('#draw').disabled=!can||rolling;
    if(d.state!=='spinning')rolling=false;
    $('#draw').className=d.state==='spinning'?'rolling':'';
  }catch(e){$('#stateText').textContent='连接失败，重试中…'}
}
function draw(){
  rolling=true;$('#draw').disabled=true;
  fetch('/api/draw',{method:'POST'}).then(r=>r.json()).then(d=>{
    if(d.status==='busy'&&d.state==='homing')return;
    setTimeout(poll,300);
  });
}
function testTicket(){fetch('/api/printer/test',{method:'POST'})}
poll();setInterval(poll,1000);
</script>
<script src="app.js"></script>
</body>
</html>
