<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家 Logo</title>
<style>
:root{--p:#e8433f;--g:#2ecc71;--bg:#1a1a2e;--card:#16213e;--tx:#eee}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:560px;margin:0 auto;font-size:14px}
nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
nav a{color:#8ab4ff;text-decoration:none;font-size:13px;padding:6px 10px;background:var(--card);border-radius:6px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px}
canvas{background:#fff;border-radius:8px;width:100%;image-rendering:pixelated;margin:10px 0}
input[type=file]{margin:8px 0}
input[type=range]{width:100%}
button{background:#334;padding:8px 18px;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:4px 6px 0 0}
button.primary{background:var(--p)}
label{font-size:12px;color:#9ab}
.info{font-size:12px;color:#9ab;margin-top:10px;line-height:1.6}
.warn{color:#f39c12;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<nav><a href="/index.html">抽奖</a><a href="/prizes.html">奖池</a><a href="/receipt.html">小票</a><a href="/logo.html">Logo</a><a href="/calibrate.html">标定</a><a href="/wifi.html">WiFi</a></nav>
<div class="card">
  <b>上传商家 Logo</b>
  <div class="info" id="current">读取中…</div>
  <input type="file" id="file" accept="image/png,image/jpeg">
  <label>二值化阈值：<span id="thv">128</span></label>
  <input type="range" id="threshold" min="1" max="254" value="128" oninput="thv.textContent=this.value;render()">
  <label><input type="checkbox" id="dither" onchange="render()"> Floyd–Steinberg 抖动（渐变 logo 更有层次）</label>
  <canvas id="cv" width="384" height="120"></canvas>
  <div class="info">目标宽 384 dots（58mm 纸满宽）；建议高度 ≤ 96（打印 ≈0.4s）</div>
  <button class="primary" onclick="upload()">上传并预览</button>
  <button onclick="del()">删除 Logo</button>
  <div id="msg" class="warn"></div>
</div>
<div class="card">
  <div class="info">
  ⚠️ Logo 属装饰内容：上传坏数据会被拒绝；设备上 logo 损坏时自动跳过、小票照常打印。<br>
  上传后请到 <a href="/receipt.html" style="color:#8ab4ff">小票文案</a> 打开「Logo 票头」开关。
  </div>
</div>
<script>
const $=s=>document.querySelector((s[0]==='#'||s[0]==='.')?s:('#'+s));
let img=null,bw=null,bh=0;
// 浏览器侧转换（D14）：固件零解码库，只收 1-bit 栅格
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();
  im.onload=()=>{img=im;render()};
  im.src=URL.createObjectURL(f);
};
function render(){
  if(!img)return;
  const cv=$('#cv'),ctx=cv.getContext('2d');
  const W=384,H=Math.min(256,Math.max(1,Math.round(img.height*W/img.width)));
  cv.width=W;cv.height=H;cv.style.height=(H*0.8)+'px';
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.drawImage(img,0,0,W,H);
  const src=ctx.getImageData(0,0,W,H);
  const th=+$('#threshold').value,dither=$('#dither').checked;
  const err=new Float32Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=(y*W+x)*4;
    const gray=0.299*src.data[i]+0.587*src.data[i+1]+0.114*src.data[i+2]+err[y*W+x];
    const on=gray<th;                       // 暗=点（热敏打印黑点）
    const v=on?0:255, diff=gray-v;
    src.data[i]=src.data[i+1]=src.data[i+2]=v;
    if(dither){
      if(x+1<W)err[y*W+x+1]+=diff*7/16;
      if(y+1<H){const r=(y+1)*W;
        if(x>0)err[r+x-1]+=diff*3/16;
        err[r+x]+=diff*5/16;
        if(x+1<W)err[r+x+1]+=diff*1/16;}
    }
  }
  ctx.putImageData(src,0,0);
  bw=W;bh=H;
}
async function showCurrent(){
  const r=await fetch('/api/logo');
  const d=await r.json();
  $('#current').textContent=d.exists?
    `当前：${d.width}×${d.height} dots（${d.bytes} B，约 ${(d.print_ms/1000).toFixed(1)}s）`:
    '当前：未上传（默认不出票头 Logo）';
}
async function upload(){
  if(!bw){$('#msg').textContent='请先选择图片';return}
  // 打包 LGO1 头 + MSB 优先 1-bit 栅格
  const cv=$('#cv'),ctx=cv.getContext('2d');
  const data=ctx.getImageData(0,0,bw,bh).data;
  const bytesPerRow=bw/8,total=8+bytesPerRow*bh;
  const buf=new Uint8Array(total);
  buf.set([0x4C,0x47,0x4F,0x31],0);          // "LGO1"
  buf[4]=bw&255;buf[5]=bw>>8;buf[6]=bh&255;buf[7]=bh>>8;
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){
    const gray=data[(y*bw+x)*4];
    if(gray<128)buf[8+y*bytesPerRow+(x>>3)]|=0x80>>(x&7);   // MSB 优先
  }
  const r=await fetch('/api/logo',{method:'POST',body:buf});
  const d=await r.json();
  $('#msg').textContent=r.ok?`✅ 已上传 ${d.width}×${d.height}（${d.bytes} B）`:'❌ '+(d.error||'上传失败');
  showCurrent();
}
async function del(){
  await fetch('/api/logo',{method:'DELETE'});
  $('#msg').textContent='已删除';showCurrent();
}
showCurrent();
</script>
</body>
</html>
