}\n if(p==='/api/wifi/ip'){if(b.dhcp){db.wifi.ip_mode=0}else{Object.assign(db.wifi,{ip_mode:1,ip:b.ip,netmask:b.netmask,gateway:b.gateway,static_ip:b.ip,static_mask:b.netmask,static_gw:b.gateway})}persist();return response({ok:true})}\n if(p==='/api/wifi/disconnect'){db.wifi.sta_connected=false;db.wifi.user_disconnected=true;persist();return response({ok:true})}\n if(p==='/api/wifi/reconnect'){db.wifi.sta_connected=true;db.wifi.user_disconnected=false;persist();return response({ok:true})}\n if(p==='/api/wifi/scan')return response(m==='POST'?{ok:true}:{running:false,aps:[{ssid:'Lucky_Event_Studio',secure:true,rssi:-42,bars:4},{ssid:'Studio_Backup',secure:true,rssi:-63,bars:3},{ssid:'Event_Guest',secure:false,rssi:-71,bars:2}]});\n return response({error:'该接口没有模拟实现：'+p},501);\n }\n window.fetch=(input,opts)=>{const str=typeof input==='string'?input:input.url,url=new URL(str,document.baseURI);if(url.pathname.startsWith('/api/'))return route(url,opts);return originalFetch(input,opts)};\n})();\n\u003c/script>\u003c/head>\u003cbody class=\"lp-app lp-page-calibrate\" data-page=\"calibrate\">\u003ca class=\"lp-skip\" href=\"#main\">跳转到主要内容\u003c/a>\u003caside class=\"lp-sidebar\" id=\"lpSidebar\" aria-label=\"主导航\">\u003ca class=\"lp-brand\" href=\"./index.html\">\u003cspan class=\"lp-brand-symbol\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4\"/>\u003c/svg>\u003c/span>\u003cspan class=\"lp-brand-name\">Lucky Studio\u003csmall>幸运翻页机 · 设备控制台\u003c/small>\u003c/span>\u003c/a>\u003cdiv class=\"lp-machine\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4\"/>\u003c/svg>\u003cdiv>\u003cstrong>Lucky Page Controller\u003c/strong>\u003csmall>LOCAL DEVICE WORKSPACE\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"lp-group-label\">运营工作空间\u003c/div>\u003cnav class=\"lp-nav\">\u003ca href=\"./index.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003c/svg>\u003cspan>抽奖工作台\u003c/span>\u003c/a>\u003ca href=\"./prizes.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/>\u003cpath d=\"M5 12v9h14v-9M12 8v13M12 8C5 8 4 2 8 3c3 0 4 5 4 5Zm0 0c7 0 8-6 4-5-3 0-4 5-4 5Z\"/>\u003c/svg>\u003cspan>奖池管理\u003c/span>\u003c/a>\u003ca href=\"./receipt.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 3h14v18l-3-2-4 2-4-2-3 2ZM8 8h8M8 12h8M8 16h4\"/>\u003c/svg>\u003cspan>小票设计\u003c/span>\u003c/a>\u003c/nav>\u003cdiv class=\"lp-nav-separator\">\u003c/div>\u003cdiv class=\"lp-group-label\">设备与品牌\u003c/div>\u003cnav class=\"lp-nav\">\u003ca href=\"./logo.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/>\u003ccircle cx=\"8\" cy=\"8\" r=\"1.5\"/>\u003cpath d=\"m3 17 5-5 5 5 4-4 4 4\"/>\u003c/svg>\u003cspan>品牌素材\u003c/span>\u003c/a>\u003ca href=\"./calibrate.html\" class=\"on\" aria-current=\"page\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 3v5M5 14v7M12 3v10M12 19v2M19 3v2M19 11v10M2 8h6M9 19h6M16 5h6\"/>\u003c/svg>\u003cspan>设备标定\u003c/span>\u003c/a>\u003ca href=\"./wifi.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0\"/>\u003ccircle cx=\"12\" cy=\"20\" r=\".8\"/>\u003c/svg>\u003cspan>网络连接\u003c/span>\u003c/a>\u003c/nav>\u003cdiv class=\"lp-sidebar-bottom\">\u003cdiv class=\"lp-demo-note\" id=\"demoNotice\" hidden>\u003cspan>演示环境 · 模拟设备数据\u003c/span>本次操作不会驱动设备或打印。\u003cbr>\u003cbutton id=\"resetDemo\">重置演示数据\u003c/button>\u003c/div>\u003cdiv class=\"lp-side-foot\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6ZM8 12l3 3 5-6\"/>\u003c/svg>\u003cdiv>\u003cstrong>设备本地工作空间\u003c/strong>\u003csmall>Designed for every lucky moment.\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003c/aside>\u003cdiv class=\"lp-workspace\">\u003cheader class=\"lp-topbar\">\u003cdiv class=\"lp-breadcrumb\">\u003cbutton class=\"lp-menu-button\" aria-label=\"打开导航\" aria-controls=\"lpSidebar\" aria-expanded=\"false\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 6h16M4 12h16M4 18h16\"/>\u003c/svg>\u003c/button>\u003cspan class=\"lp-breadcrumb-parent\">设备工作空间\u003c/span>\u003cspan class=\"lp-breadcrumb-slash\">/\u003c/span>\u003cspan>设备标定\u003c/span>\u003c/div>\u003cdiv class=\"lp-topright\">\u003cspan class=\"lp-connection\" id=\"connection\">\u003ci>\u003c/i>\u003cspan>连接设备中\u003c/span>\u003c/span>\u003cspan class=\"lp-topline\">\u003c/span>\u003ctime id=\"clock\">\u003c/time>\u003cspan class=\"lp-topinfo\" title=\"设备本地控制台\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 11v6M12 7v.1\"/>\u003c/svg>\u003c/span>\u003c/div>\u003c/header>\u003cmain class=\"lp-page\" id=\"main\">\u003cheader class=\"lp-page-head\">\u003cdiv>\u003cdiv class=\"lp-eyebrow\">DEVICE CALIBRATION\u003c/div>\u003ch1>设备标定\u003c/h1>\u003cp class=\"lp-subtitle\">调整行程偏移，逐页核对机械落点。\u003c/p>\u003c/div>\u003cdiv class=\"lp-page-actions\">\u003cdiv class=\"lp-status-slot\">\u003cspan class=\"chip\" id=\"pageChip\">—\u003c/span>\u003c/div>\u003c/div>\u003c/header>\u003cdiv class=\"lp-content\">\n\n\n\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-head\">当前页行程\u003c/div>\n  \u003cdiv class=\"status\">\n    \u003cdiv class=\"it\">\u003cspan class=\"k\">当前页\u003c/span>\u003cspan class=\"v\" id=\"stCur\">–\u003c/span>\u003c/div>\n    \u003cdiv class=\"it\">\u003cspan class=\"k\">基础值\u003c/span>\u003cspan class=\"v\" id=\"stBase\">–\u003c/span>\u003c/div>\n    \u003cdiv class=\"it\">\u003cspan class=\"k\">偏移\u003c/span>\u003cspan class=\"v off\" id=\"stOff\">–\u003c/span>\u003c/div>\n    \u003cdiv class=\"it\">\u003cspan class=\"k\">实际值\u003c/span>\u003cspan class=\"v act\" id=\"stAct\">–\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"hint\">实际值 = clamp(基础值 + 偏移, 0, 255)，就是真正下发给 DMX 的行程。\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-head\">微调偏移\u003cspan class=\"card-actions\">\u003cspan class=\"hint\" style=\"margin:0\">只改偏移，不翻页\u003c/span>\u003c/span>\u003c/div>\n  \u003cdiv class=\"grid3\">\n    \u003cbutton class=\"plus\" id=\"adj_p10\" onclick=\"adjust(10)\">+10\u003c/button>\n    \u003cbutton class=\"plus\" id=\"adj_p5\" onclick=\"adjust(5)\">+5\u003c/button>\n    \u003cbutton class=\"plus\" id=\"adj_p1\" onclick=\"adjust(1)\">+1\u003c/button>\n    \u003cbutton class=\"minus\" id=\"adj_m1\" onclick=\"adjust(-1)\">-1\u003c/button>\n    \u003cbutton class=\"minus\" id=\"adj_m5\" onclick=\"adjust(-5)\">-5\u003c/button>\n    \u003cbutton class=\"minus\" id=\"adj_m10\" onclick=\"adjust(-10)\">-10\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-head\">翻页点动\u003cspan class=\"card-actions\">\u003cspan class=\"hint\" style=\"margin:0\">真实翻页，请注意机械安全\u003c/span>\u003c/span>\u003c/div>\n  \u003cdiv class=\"grid4\">\n    \u003cbutton id=\"navPrev\" onclick=\"step(-1)\">上页\u003c/button>\n    \u003cbutton id=\"navNext\" onclick=\"step(1)\">下页\u003c/button>\n    \u003cbutton id=\"navFirst\" onclick=\"gotoPage(0)\">首页\u003c/button>\n    \u003cbutton id=\"navLast\" onclick=\"gotoPage(pages-1)\">末页\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"row\" style=\"margin-top:12px\">\n    \u003clabel for=\"jumpPage\">跳到第\u003c/label>\n    \u003cinput type=\"number\" id=\"jumpPage\" min=\"1\" max=\"30\" value=\"1\">\n    \u003clabel for=\"jumpPage\">页\u003c/label>\n    \u003cbutton id=\"jumpBtn\" onclick=\"jump()\">点动\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"msg\" id=\"msg\">\u003c/div>\n\n\u003cdiv class=\"zone-danger\">\n  \u003cdiv class=\"card-head\">危险操作\u003c/div>\n  \u003cdiv class=\"hint\">清零只影响「偏移」，基础映射不受影响；\u003cb>清零全部\u003c/b>会丢失所有微调成果。\u003c/div>\n  \u003cdiv class=\"grid4\" style=\"margin-top:10px\">\n    \u003cbutton id=\"clrPage\" class=\"danger\" onclick=\"clearPage()\">清零本页偏移\u003c/button>\n    \u003cbutton id=\"clrAll\" class=\"danger\" onclick=\"clearAll()\">清零全部偏移\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-head\">施工判据\u003c/div>\n  \u003cdiv class=\"hint\">\n    ⚠️ \u003cb>30 页可用性判据\u003c/b>：逐页点动，若任意两页落到同一格、或落页与目标不符 →\n    该机台\u003cb>不支持 30 页\u003c/b>，请到「奖池」页下调总页数（建议 10~16）或更换行程更大的执行器。\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- 高级：基础映射（默认折叠，避免误用；值来自设备真实映射，不再是公式猜测） -->\n\u003cdetails class=\"card\" id=\"advBase\">\n  \u003csummary>高级：基础映射（绝对行程值，一般不用改）\u003c/summary>\n  \u003cdiv class=\"hint\">\n    这里是「理论基准」：日常微调用上面的\u003cb>偏移\u003c/b>即可。保存会\u003cb>整表覆盖\u003c/b>基准映射，\n    只在下述情况使用：重新生成一套均匀行程、或换了执行器。\n  \u003c/div>\n  \u003ctable id=\"tbl\">\u003ctr>\u003cth>页码\u003c/th>\u003cth>行程值\u003c/th>\u003cth>点动验证\u003c/th>\u003c/tr>\u003c/table>\n  \u003cdiv class=\"row\">\u003cbutton class=\"primary\" onclick=\"saveBase()\">保存基础映射\u003c/button>\n  \u003cbutton onclick=\"loadBase().then(renderBaseTable)\">重新读取\u003c/button>\u003c/div>\n\u003c/details>\n\n\u003cdiv class=\"actbar\">\n  \u003cbutton class=\"primary block\" onclick=\"step(1)\">下页并确认\u003c/button>\n\u003c/div>\n\n\u003c/div>\u003cfooter class=\"lp-footer\">\u003cspan>\u003ci class=\"lp-dot\">\u003c/i>Lucky Studio \u003cspan style=\"color:#bdc8b9\">/\u003c/span> 幸运翻页机控制台\u003c/span>\u003cspan id=\"footerMode\">本地连接 · 无需外部资源\u003c/span>\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"lp-scrim\">\u003c/div>\u003cnav class=\"lp-mobile-nav\" aria-label=\"移动端导航\">\u003ca href=\"./index.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003c/svg>\u003cspan>抽奖工作台\u003c/span>\u003c/a>\u003ca href=\"./prizes.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/>\u003cpath d=\"M5 12v9h14v-9M12 8v13M12 8C5 8 4 2 8 3c3 0 4 5 4 5Zm0 0c7 0 8-6 4-5-3 0-4 5-4 5Z\"/>\u003c/svg>\u003cspan>奖池管理\u003c/span>\u003c/a>\u003ca href=\"./receipt.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 3h14v18l-3-2-4 2-4-2-3 2ZM8 8h8M8 12h8M8 16h4\"/>\u003c/svg>\u003cspan>小票设计\u003c/span>\u003c/a>\u003cbutton aria-label=\"更多导航\" aria-controls=\"lpSidebar\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 6h16M4 12h16M4 18h16\"/>\u003c/svg>\u003cspan>更多\u003c/span>\u003c/button>\u003c/nav>\u003cscript>\nconst $=s=>document.querySelector((s[0]==='#'||s[0]==='.')?s:('#'+s));\nlet pages=30, mapping=[], offsets=[], cur=0;\n\nfunction setMsg(kind,text){\n  if(window.showMsg) showMsg('#msg',kind,text);\n  else {$('#msg').textContent=text;$('#msg').className='msg show '+(kind==='ok'?'ok':kind==='err'?'err':'warn');}\n}\nfunction baseOf(p){ return (p>=0&&p\u003cmapping.length)?mapping[p]:0; }\nfunction offOf(p){ return (p>=0&&p\u003coffsets.length)?offsets[p]:0; }\nfunction clampOffset(v){ return Math.max(-128, Math.min(127, v)); }\n\nfunction paintStatus(){\n  $('#stCur').textContent=(cur+1)+'/'+pages;\n  $('#stBase').textContent=baseOf(cur);\n  const o=offOf(cur);\n  $('#stOff').textContent=(o>0?'+':'')+o;\n  $('#stAct').textContent=Math.max(0,Math.min(255,baseOf(cur)+o));\n  $('#pageChip').textContent='第 '+(cur+1)+' / '+pages+' 页';\n  const jp=$('#jumpPage'); if(jp){ jp.max=pages; if(!jp.value||+jp.value\u003c1||+jp.value>pages) jp.value=cur+1; }\n}\n\n// 基础映射：读设备**真实**值（旧版这里按公式猜，会把真实映射覆盖掉 —— 已修）\nasync function loadBase(){\n  const pg=await fetch('/api/pages').then(r=>r.json());\n  pages=pg.total_pages||pages;\n  if(Array.isArray(pg.values)&&pg.values.length) mapping=pg.values.slice();\n  return pg;\n}\n// 偏移：与基础映射一起由 /api/adjust 返回\nasync function loadAdjust(){\n  const a=await fetch('/api/adjust').then(r=>r.json());\n  pages=a.total_pages||pages;\n  if(Array.isArray(a.mapping)&&a.mapping.length) mapping=a.mapping.slice();\n  offsets=(Array.isArray(a.offsets)&&Array.isArray(a.offsets[0]))?a.offsets[0].slice():[];\n}\n// 设备当前页只作初值：点动(DirectDrive)不更新它，故之后一律用界面本地游标\nasync function loadCurrentPage(){\n  try{\n    const s=await fetch('/api/lottery/status').then(r=>r.json());\n    if(typeof s.current_page==='number'&&s.current_page>=0&&s.current_page\u003cpages) cur=s.current_page;\n  }catch(e){ /* 降级：保持本地游标 0，不影响调整 */ }\n}\n\nfunction renderBaseTable(){\n  const t=$('#tbl');\n  [...t.querySelectorAll('tr:not(:first-child)')].forEach(r=>r.remove());\n  for(let i=0;i\u003cmapping.length;i++){\n    const tr=document.createElement('tr');\n    tr.innerHTML=`\u003ctd>P${i+1}\u003c/td>\n      \u003ctd>\u003cinput type=\"number\" id=\"v${i}\" value=\"${mapping[i]}\" min=\"0\" max=\"255\">\u003c/td>\n      \u003ctd>\u003cbutton class=\"mini\" onclick=\"gotoPage(${i})\">点动\u003c/button>\u003c/td>`;\n    t.appendChild(tr);\n  }\n}\n\nasync function adjust(d){\n  const want=clampOffset(offOf(cur)+d);\n  const r=await fetch('/api/adjust',{method:'PUT',\n    body:JSON.stringify({cell:0,page:cur,offset:want})});\n  const j=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('err','❌ '+(j.error||'调整失败')); return; }\n  // 一律以服务端返回为准（钳位、实际值都在服务端算，前端不自己推断）\n  offsets[cur]=j.offset; mapping[cur]=j.base;\n  paintStatus(); renderBaseTable();\n  setMsg('ok','已调整 P'+(cur+1)+'：基础 '+j.base+' '+(j.offset>=0?'+':'')+j.offset+' = 实际 '+j.value);\n}\n\nasync function gotoPage(p){\n  if(p\u003c0||p>=pages){ setMsg('err','页码越界（1~'+pages+'）'); return; }\n  const r=await fetch('/api/page/goto',{method:'POST',body:JSON.stringify({page:p})});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('err','❌ '+(d.error||'状态不允许点动')); return; }\n  cur=p; paintStatus();\n  setMsg('ok','已点动到 P'+(p+1)+'（实际行程 '+$('#stAct').textContent+'），请目视确认落页');\n}\nfunction step(d){ gotoPage(cur+d); }\nfunction jump(){\n  const v=+$('#jumpPage').value;\n  if(!(v>=1&&v\u003c=pages)){ setMsg('err','请输入 1~'+pages+' 之间的页码'); return; }\n  gotoPage(v-1);\n}\n\nasync function clearPage(){\n  const r=await fetch('/api/adjust/reset',{method:'POST',body:JSON.stringify({cell:0,page:cur})});\n  const j=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('err','❌ '+(j.error||'清零失败')); return; }\n  offsets[cur]=0; paintStatus();\n  setMsg('ok','已清零 P'+(cur+1)+' 的偏移（回到基础值 '+baseOf(cur)+'）');\n  if(window.toast) toast('本页偏移已清零','warn');\n}\nasync function clearAll(){\n  if(!confirm('清零全部页的行程偏移？\\n基础映射不受影响，微调成果会丢失。')) return;\n  const r=await fetch('/api/adjust/reset',{method:'POST',body:JSON.stringify({cell:-1})});\n  const j=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('err','❌ '+(j.error||'清零失败')); return; }\n  offsets=offsets.map(()=>0); paintStatus();\n  setMsg('ok','已清零全部偏移（共 '+(j.cleared||offsets.length)+' 页）');\n  if(window.toast) toast('全部偏移已清零','warn');\n}\n\nasync function saveBase(){\n  const vals=mapping.map((_,i)=>+$('#v'+i).value);\n  const body=JSON.stringify({values:vals,names:vals.map((_,i)=>'P'+(i+1))});\n  const r=await fetch('/api/page-mapping',{method:'PUT',body});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('err','❌ '+(d.error||'保存失败')); return; }\n  mapping=vals; paintStatus();\n  setMsg('ok','✅ 基础映射已保存（重启后生效于归零断言）');\n}\n\n(async function boot(){\n  try{\n    await loadBase();      // 先拿真实基础映射（即使 /api/adjust 失败也能显示基准值）\n    await loadAdjust();    // 再叠加偏移\n    await loadCurrentPage();\n  }catch(e){\n    setMsg('warn','⚠ 读取标定数据失败：'+(e&&e.message?e.message:e));\n  }\n  renderBaseTable(); paintStatus();\n})();\n\u003c/script>\n\u003cscript>/* Shared interactions; no framework or remote dependencies. */\n(function(){\n 'use strict';\n const L=window.Lucky=window.Lucky||{},icons={\"grid\": \"\u003crect x=\\\"3\\\" y=\\\"3\\\" width=\\\"7\\\" height=\\\"7\\\" rx=\\\"1.5\\\"/>\u003crect x=\\\"14\\\" y=\\\"3\\\" width=\\\"7\\\" height=\\\"7\\\" rx=\\\"1.5\\\"/>\u003crect x=\\\"3\\\" y=\\\"14\\\" width=\\\"7\\\" height=\\\"7\\\" rx=\\\"1.5\\\"/>\u003crect x=\\\"14\\\" y=\\\"14\\\" width=\\\"7\\\" height=\\\"7\\\" rx=\\\"1.5\\\"/>\", \"gift\": \"\u003crect x=\\\"3\\\" y=\\\"8\\\" width=\\\"18\\\" height=\\\"4\\\" rx=\\\"1\\\"/>\u003cpath d=\\\"M5 12v9h14v-9M12 8v13M12 8C5 8 4 2 8 3c3 0 4 5 4 5Zm0 0c7 0 8-6 4-5-3 0-4 5-4 5Z\\\"/>\", \"receipt\": \"\u003cpath d=\\\"M5 3h14v18l-3-2-4 2-4-2-3 2ZM8 8h8M8 12h8M8 16h4\\\"/>\", \"image\": \"\u003crect x=\\\"3\\\" y=\\\"3\\\" width=\\\"18\\\" height=\\\"18\\\" rx=\\\"3\\\"/>\u003ccircle cx=\\\"8\\\" cy=\\\"8\\\" r=\\\"1.5\\\"/>\u003cpath d=\\\"m3 17 5-5 5 5 4-4 4 4\\\"/>\", \"sliders\": \"\u003cpath d=\\\"M5 3v5M5 14v7M12 3v10M12 19v2M19 3v2M19 11v10M2 8h6M9 19h6M16 5h6\\\"/>\", \"wifi\": \"\u003cpath d=\\\"M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0\\\"/>\u003ccircle cx=\\\"12\\\" cy=\\\"20\\\" r=\\\".8\\\"/>\", \"arrow\": \"\u003cpath d=\\\"M5 12h14m-5-5 5 5-5 5\\\"/>\", \"refresh\": \"\u003cpath d=\\\"M20 7v5h-5M4 17v-5h5M5 7a8 8 0 0 1 13-2l2 3M4 16l2 3a8 8 0 0 0 13-2\\\"/>\", \"plus\": \"\u003cpath d=\\\"M12 5v14M5 12h14\\\"/>\", \"chip\": \"\u003crect x=\\\"6\\\" y=\\\"6\\\" width=\\\"12\\\" height=\\\"12\\\" rx=\\\"2\\\"/>\u003cpath d=\\\"M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4\\\"/>\", \"clock\": \"\u003ccircle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"9\\\"/>\u003cpath d=\\\"M12 7v5l3 2\\\"/>\", \"box\": \"\u003cpath d=\\\"m3 6 9-4 9 4v12l-9 4-9-4Zm0 0 9 4 9-4M12 10v12M7 4l10 5\\\"/>\", \"power\": \"\u003cpath d=\\\"M12 3v9M7 6a8 8 0 1 0 10 0\\\"/>\", \"menu\": \"\u003cpath d=\\\"M4 6h16M4 12h16M4 18h16\\\"/>\", \"check\": \"\u003cpath d=\\\"m5 12 4 4L20 5\\\"/>\", \"spark\": \"\u003cpath d=\\\"m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4\\\"/>\", \"printer\": \"\u003cpath d=\\\"M7 8V3h10v5M7 18H4V8h16v10h-3M7 14h10v7H7ZM17 11h.1\\\"/>\", \"shield\": \"\u003cpath d=\\\"m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6ZM8 12l3 3 5-6\\\"/>\", \"trend\": \"\u003cpath d=\\\"M4 19h16M5 14l5-5 4 3 6-8M15 4h5v5\\\"/>\", \"trash\": \"\u003cpath d=\\\"M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7\\\"/>\", \"info\": \"\u003ccircle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"9\\\"/>\u003cpath d=\\\"M12 11v6M12 7v.1\\\"/>\"};\n L.icon=n=>'\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">'+(icons[n]||icons.grid)+'\u003c/svg>';\n L.escape=s=>String(s==null?'':s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n L.demo=!!window.LUCKY_DEMO_ACTIVE;\n L.link=n=>'./'+n+(L.demo?'?demo=1':'');\n L.connection=(ok)=>{const el=document.getElementById('connection');el.classList.toggle('offline',!ok);el.querySelector('span').textContent=ok?(L.demo?'模拟设备在线':'设备已连接'):'设备连接中断'};\n let toastTimer;\n window.toast=(text,kind)=>{let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el)}el.textContent=text;el.className='show'+(kind==='err'?' err':kind==='warn'?' warn':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='',3200)};\n window.showMsg=(id,kind,text)=>{const el=typeof id==='string'?document.getElementById(id.replace(/^#/,'')):id;if(el){el.className='msg show '+(kind==='err'?'err':kind==='warn'?'warn':'ok');el.textContent=text;el.setAttribute('role',kind==='err'?'alert':'status')}};\n window.hideMsg=id=>{const el=typeof id==='string'?document.getElementById(id.replace(/^#/,'')):id;if(el)el.className='msg'};\n L.api=async(url,method='GET',body)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const opts={method,signal:c.signal};if(body!==undefined){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(body)}const r=await fetch(url,opts);let d;try{d=await r.json()}catch{throw Error('设备响应格式错误')}if(!r.ok||d.ok===false||d.error)throw Error(d.error||'HTTP '+r.status);return d}finally{clearTimeout(t)}};\n L.confirm=(title,message,action='确认操作')=>new Promise(resolve=>{const d=document.createElement('dialog');d.className='lp-dialog';d.innerHTML='\u003ch3>'+L.escape(title)+'\u003c/h3>\u003cp>'+L.escape(message)+'\u003c/p>\u003cdiv class=\"lp-dialog-actions\">\u003cbutton value=\"cancel\">取消\u003c/button>\u003cbutton class=\"danger\" value=\"ok\">'+L.escape(action)+'\u003c/button>\u003c/div>';document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target.value)d.close(e.target.value)});d.addEventListener('close',()=>{const ok=d.returnValue==='ok';d.remove();resolve(ok)});d.showModal();d.querySelector('button').focus()});\n document.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(href.startsWith('#')||a.download)return;const u=new URL(href,document.baseURI);if(/\\.html$/.test(u.pathname)&&(!/^https?:/.test(href)||u.origin===location.origin)){const name=u.pathname.split('/').pop();a.setAttribute('href',L.link(name)+u.hash)}});\n const page=document.body.dataset.page;\n document.querySelectorAll('.lp-nav a,.lp-mobile-nav a').forEach(a=>{const name=a.getAttribute('href').split('/').pop().split('?')[0];a.classList.toggle('on',name===page+'.html');if(name===page+'.html')a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});\n if(L.demo){document.getElementById('demoNotice').hidden=false;document.getElementById('footerMode').textContent='演示数据 · 不代表真实设备状态';document.getElementById('resetDemo').onclick=()=>window.LUCKY_RESET_DEMO&&window.LUCKY_RESET_DEMO()}\n const aside=document.getElementById('lpSidebar'),menuButton=document.querySelector('.lp-menu-button');let lastFocus=null;\n function menu(open){if(open&&typeof window.closeSheet==='function')window.closeSheet();document.body.classList.toggle('menu-open',open);menuButton.setAttribute('aria-expanded',String(open));if(open){lastFocus=document.activeElement;aside.querySelector('a').focus()}else if(lastFocus)lastFocus.focus()}\n menuButton.onclick=()=>menu(!document.body.classList.contains('menu-open'));document.querySelector('.lp-mobile-nav button').onclick=()=>menu(true);document.querySelector('.lp-scrim').onclick=()=>menu(false);\n document.addEventListener('keydown',e=>{if(!document.body.classList.contains('menu-open'))return;if(e.key==='Escape'){menu(false);return}if(e.key==='Tab'){const focusable=Array.from(aside.querySelectorAll('a,button')).filter(x=>!x.hidden&&x.getClientRects().length),first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});\n const clock=()=>{const el=document.getElementById('clock'),now=new Date();el.textContent=now.toLocaleTimeString('zh-CN',{hour12:false});el.dateTime=now.toISOString()};clock();const clockTimer=setInterval(clock,1000);\n const observed=window.fetch.bind(window);\n window.fetch=async(input,opts)=>{const path=typeof input==='string'?input:input.url;try{const r=await observed(input,opts);if(path.split('?')[0]==='/api/lottery/status')L.connection(r.ok);return r}catch(e){if(path.startsWith('/api/')&&e.name!=='AbortError')L.connection(false);throw e}};\n let probeTimer=null;if(page!=='index'){const probe=()=>{if(!document.hidden)fetch('/api/lottery/status').then(r=>L.connection(r.ok)).catch(()=>L.connection(false))};probe();probeTimer=setInterval(probe,10000)}\n function enhance(root){const props=document.getElementById('propsBtn');if(props){props.setAttribute('aria-controls','panels');props.setAttribute('aria-expanded',String(document.body.classList.contains('sheet-open')));document.getElementById('panels').setAttribute('role','region');document.getElementById('panels').setAttribute('aria-label','元素属性与参数')}root.querySelectorAll('input,select,textarea').forEach(el=>{if(el.labels&&el.labels.length||(el.getAttribute('aria-label')&&!el.dataset.lpAutoLabel))return;const row=el.closest('td,.field,.ip-row,.row');let label=el.previousElementSibling;while(label&&label.tagName!=='LABEL'&&label.tagName!=='INPUT'&&label.tagName!=='SELECT'&&label.tagName!=='TEXTAREA')label=label.previousElementSibling;if(!label||label.tagName!=='LABEL')label=row&&row.querySelector('label');el.setAttribute('aria-label',label?label.textContent.trim():row&&row.dataset.label?row.dataset.label:el.placeholder||el.id||'输入内容');el.dataset.lpAutoLabel='1'});root.querySelectorAll('.msg').forEach(el=>{if(!el.getAttribute('role'))el.setAttribute('role','status')});root.querySelectorAll('#canvas .el').forEach((el,i)=>{el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','编辑第 '+(i+1)+' 个元素：'+el.textContent.slice(0,24));if(!el.dataset.keyBound){el.dataset.keyBound='1';el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,clientX:el.getBoundingClientRect().left+2,clientY:el.getBoundingClientRect().top+2,pointerId:1}));document.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:1}))}})}})}\n enhance(document);new MutationObserver(()=>enhance(document.querySelector('.lp-content'))).observe(document.querySelector('.lp-content'),{childList:true,subtree:true});\n window.addEventListener('pagehide',()=>{clearInterval(clockTimer);clearInterval(probeTimer)});\n})();\n\u003c/script>\u003cscript>(function(){\n 'use strict';const L=window.Lucky,page=document.body.dataset.page;\n if(page==='logo'){\n  const hint=Array.from(document.querySelectorAll('.hint')).find(e=>e.textContent.includes('数值越小'));\n  if(hint)hint.textContent='阈值越大，更多像素会转为黑点。请以黑白点阵预览为准。';\n  const oldDel=window.del;window.del=async()=>{if(!await L.confirm('删除票头 Logo？','使用这张图片的小票将不再打印该 Logo，其他版式内容保持不变。','删除 Logo'))return;try{await L.api('/api/logo','DELETE');show('ok','Logo 已删除');toast('Logo 已删除');showCurrent()}catch(e){show('err','删除失败：'+e.message)}};\n }\n if(page==='calibrate'){\n  // Keep physical controls disabled until the real calibration read succeeds.\n  const controls=Array.from(document.querySelectorAll('.grid3 button,.grid4 button,#jumpBtn,.actbar button,#advBase button'));\n  const check=()=>{const available=typeof mapping!=='undefined'&&mapping.length>0&&typeof offsets!=='undefined'&&offsets.length>=mapping.length;controls.forEach(b=>b.disabled=!available);if(!available){document.getElementById('pageChip').textContent='标定数据未就绪';if(typeof mapping==='undefined'||!mapping.length){['stCur','stBase','stOff','stAct'].forEach(id=>document.getElementById(id).textContent='—')}}};check();const t=setInterval(check,800);window.addEventListener('pagehide',()=>clearInterval(t));\n }\n if(page==='receipt'){\n  const baselineTitle=document.querySelector('.lp-page-actions');\n  const badge=document.createElement('span');badge.className='lp-unsaved-tag';badge.hidden=true;badge.textContent='未保存更改';baselineTitle.appendChild(badge);\n  let baseline=null,initialized=false;\n  const snapshot=()=>{try{return JSON.stringify(payload())}catch{return null}};\n  const capture=()=>{if(!initialized&&document.getElementById('params').textContent.trim()!=='加载中…'){baseline=snapshot();initialized=true}};capture();\n  const originalSave=window.save;window.save=async()=>{try{await originalSave();const msg=document.getElementById('msg');if(msg.textContent.includes('已保存')){baseline=snapshot();badge.hidden=true;toast('小票模板已保存')}}catch(e){toast('保存失败：'+e.message,'err')}};\n  const originalLoadMode=window.loadTemplateForMode;\n  window.loadTemplateForMode=async m=>{await originalLoadMode(m);if(!document.getElementById('msg').textContent.includes('失败')){baseline=snapshot();badge.hidden=true;initialized=true}};\n  const dirty=()=>initialized&&baseline!==snapshot();\n  const originalSetMode=window.setMode;window.setMode=async m=>{if(m===mode)return;if(dirty()&&!await L.confirm('切换小票版式？','当前未保存的更改会丢失。保存后再切换可以保留这些改动。','切换版式')){document.getElementById('mode').value=mode;return}originalSetMode(m)};\n  const timer=setInterval(()=>{capture();badge.hidden=!dirty()},500);\n  window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});\n  window.addEventListener('pagehide',()=>clearInterval(timer));\n  // Existing receipt code uses real block semantics, including bg, col, row, QR size and ECC.\n }\n})();\n\u003c/script>\u003c/body>\u003c/html>", "receipt.html": "\u003c!DOCTYPE html>\u003chtml lang=\"zh-CN\">\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n\n\u003cstyle>\n/* 页面特有样式；通用组件（body/.card/h3/button/input/table/.row/.note/.warn…）\n   统一走 app.css 基础层。本页是**宽度例外**：body 加了 class=\"wide\"（画布+属性栏并排）。 */\n:root{--colw:14px;--lineh:22px}\n.layout{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}\n/* ≤1000px 单列；用 block 而非 grid：grid 项 min-width:auto 会被宽内容（标尺/画布）撑爆 */\n@media(max-width:1000px){.layout{display:block;min-width:0}}\n.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}\n.toolbar details{width:100%}\n.toolbar details summary{font-size:var(--fs-hint);color:var(--tx-dim);cursor:pointer;padding:4px 0}\n.toolbar .zgrp{display:flex;gap:4px;align-items:center}\n#zoomTxt{font-size:11px;color:var(--tx-dim);min-width:34px;text-align:center}\n#stage{overflow:auto;padding:10px;background:#0b1226;border-radius:10px;max-width:100%;overscroll-behavior:contain}\n/* 触控拖动前提：不禁用浏览器手势的话，手指拖动会被判成滚动，元素拖不动 */\n.el{touch-action:none;-webkit-touch-callout:none}\n.el.dragging{border-color:#7ab8ff;box-shadow:0 6px 18px #000a;z-index:9}\n/* 抽屉把手/收起按钮只在手机端出现（桌面端属性面板仍是右栏） */\n.handle,.sheet-close{display:none}\n/* 底栏「属性」按钮只服务手机端（桌面端右栏常显，按钮多余） */\n#propsBtn{display:none}\n#canvas{position:relative;background:#fff;color:#000;border-radius:4px;box-shadow:0 6px 24px #0008;\n       font-family:\"Menlo\",\"Consolas\",\"Courier New\",monospace;font-size:13px;line-height:var(--lineh)}\n#canvas #grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,#00000012 1px,transparent 1px);background-size:var(--colw) 100%}\n.el{position:absolute;white-space:pre;cursor:grab;border:1px dashed transparent;border-radius:3px;padding:0 1px;user-select:none;overflow:hidden}\n.el:hover{border-color:#7ab8ff}\n.el.sel{border:1px solid var(--p);background:#e8433f14;z-index:5}\n.el.qr,.el.logo{background:#0000000d;border:1px dashed #999;font-size:11px;color:#555;display:flex;align-items:center;justify-content:center}\n.el.bg{background:repeating-linear-gradient(135deg,#0af1,#0af1 8px,transparent 8px,transparent 16px);\n       border:1px dashed #0863;opacity:.85}\n.el.feed{background:repeating-linear-gradient(45deg,#00000008,#00000008 6px,transparent 6px,transparent 12px);color:#888;font-size:11px}\n#ruler{display:flex;font-size:10px;color:var(--tx-mute);font-family:monospace;margin-bottom:4px}\n#ruler span{width:calc(var(--colw)*10);flex:0 0 auto;border-left:1px solid #7893;padding-left:2px}\n.panel label{display:block;font-size:11px;color:var(--tx-dim);margin:8px 0 3px}\n/* 属性面板里的输入控件要撑满（基础层不设宽度） */\n#form input,#form select,#form textarea{width:100%}\n#form textarea{font-family:monospace;min-height:52px;resize:vertical}\n.psel{max-height:170px;o ass=\"lp-topright\">\u003cspan class=\"lp-connection\" id=\"connection\">\u003ci>\u003c/i>\u003cspan>连接设备中\u003c/span>\u003c/span>\u003cspan class=\"lp-topline\">\u003c/span>\u003ctime id=\"clock\">\u003c/time>\u003cspan class=\"lp-topinfo\" title=\"设备本地控制台\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 11v6M12 7v.1\"/>\u003c/svg>\u003c/span>\u003c/div>\u003c/header>\u003cmain class=\"lp-page\" id=\"main\">\u003cheader class=\"lp-page-head\">\u003cdiv>\u003cdiv class=\"lp-eyebrow\">RECEIPT DESIGNER\u003c/div>\u003ch1>小票设计\u003c/h1>\u003cp class=\"lp-subtitle\">编排专属兑奖凭证，让品牌呈现在每一张小票上。\u003c/p>\u003c/div>\u003cdiv class=\"lp-page-actions\">\u003cdiv class=\"lp-status-slot\">\u003c/div>\u003c/div>\u003c/header>\u003cdiv class=\"lp-content\">\n\n\n\n\n\u003cdiv id=\"errbar\" class=\"msg err\" style=\"display:none\">\u003c/div>\n\n\u003cdiv class=\"layout\">\n  \u003cdiv>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-head\">\n        画布\n        \u003cspan class=\"card-actions\">\n          \u003cspan class=\"zgrp\" title=\"画布缩放\">\n            \u003cbutton class=\"mini\" id=\"zoomOut\" onclick=\"zoomStep(-0.15)\" aria-label=\"缩小\">－\u003c/button>\n            \u003cbutton class=\"mini\" id=\"fitBtn\" onclick=\"fitCanvas()\">适应宽度\u003c/button>\n            \u003cbutton class=\"mini\" id=\"zoomIn\" onclick=\"zoomStep(0.15)\" aria-label=\"放大\">＋\u003c/button>\n            \u003cspan id=\"zoomTxt\">100%\u003c/span>\n          \u003c/span>\n        \u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"toolbar\">\n        \u003cspan class=\"tool-label\">添加\u003c/span>\n        \u003cbutton class=\"sm\" onclick=\"add('line')\">＋ 文字行\u003c/button>\n        \u003cbutton class=\"sm\" onclick=\"add('separator')\">＋ 分隔线\u003c/button>\n        \u003cbutton class=\"sm\" onclick=\"add('qr')\">＋ 二维码\u003c/button>\n        \u003cbutton class=\"sm\" onclick=\"add('logo')\">＋ Logo\u003c/button>\n        \u003cbutton class=\"sm\" onclick=\"add('feed')\">＋ 走纸\u003c/button>\n      \u003c/div>\n\n      \u003cdiv class=\"toolbar\">\n        \u003clabel class=\"tool-label\" for=\"paper\">纸宽\u003c/label>\n        \u003cselect id=\"paper\" onchange=\"setPaper(this.value)\">\n          \u003coption value=\"32\">58mm（32 列）\u003c/option>\u003coption value=\"48\">80mm（48 列）\u003c/option>\n        \u003c/select>\n        \u003clabel class=\"tool-label\" for=\"mode\">版式\u003c/label>\n        \u003cselect id=\"mode\" onchange=\"setMode(this.value)\">\n          \u003coption value=\"flow\">纯文字（最快，行数不限）\u003c/option>\n          \u003coption value=\"canvas\">画布（整框背景 + 文字叠加）\u003c/option>\n          \u003coption value=\"banner\">花边（上下分段，行数不限）\u003c/option>\n        \u003c/select>\n        \u003cspan id=\"bannerrows\" style=\"display:none\">\n          \u003clabel class=\"tool-label\" for=\"btop\">顶部花边\u003c/label>\n          \u003cinput type=\"number\" id=\"btop\" min=\"0\" max=\"10\" value=\"2\" style=\"width:56px\" onchange=\"render(0)\">\n          \u003clabel class=\"tool-label\" for=\"bbot\">行 · 底部\u003c/label>\n          \u003cinput type=\"number\" id=\"bbot\" min=\"0\" max=\"10\" value=\"3\" style=\"width:56px\" onchange=\"render(0)\">\n          \u003cspan class=\"tool-label\">行\u003c/span>\n        \u003c/span>\n        \u003cspan id=\"modehint\" class=\"hint\" style=\"margin:0\">\u003c/span>\n      \u003c/div>\n\n      \u003cdiv id=\"ruler\">\u003c/div>\n      \u003cdiv id=\"stage\">\u003cdiv id=\"canvas\">\u003cdiv id=\"grid\">\u003c/div>\u003c/div>\u003c/div>\n      \u003cdiv class=\"hint\" style=\"margin-top:8px\">虚线框 = 元素边界 · 左右拖动吸附列位 · 上下拖动调整顺序 · 点选后在右侧/抽屉编辑\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"card-head\">\n        更多\n        \u003cspan class=\"card-actions\">\u003cbutton class=\"sm ghost\" onclick=\"togglePreview()\">服务端预览\u003c/button>\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"row\" style=\"margin:0\">\n        \u003cbutton class=\"sm\" onclick=\"loadDefault()\">恢复出厂（当前类型）\u003c/button>\n        \u003cbutton class=\"sm danger\" onclick=\"resetAll()\">全部重置为出厂\u003c/button>\n      \u003c/div>\n      \u003cpre class=\"preview\" id=\"preview\">\u003c/pre>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv>\n    \u003c!-- 桌面端：右栏；手机端：底部抽屉（CSS 在 ≤640px 时把 #panels 固定到底部） -->\n    \u003cdiv id=\"panels\">\n      \u003cdiv class=\"handle\">\u003c/div>\n      \u003cbutton class=\"mini sheet-close\" onclick=\"closeSheet()\">收起\u003c/button>\n      \u003cdiv class=\"card panel\">\n        \u003cdiv class=\"card-head\">元素属性\u003c/div>\n        \u003cdiv class=\"hint\" id=\"noSel\">在画布上点选一个元素\u003c/div>\n        \u003cdiv id=\"form\" style=\"display:none\">\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card panel\">\n        \u003cdiv class=\"card-head\">插入参数\u003c/div>\n        \u003cdiv class=\"psel\" id=\"params\">加载中…\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 主操作：手机端变底部固定栏（同一批按钮，不复制 DOM） -->\n    \u003cdiv class=\"card actions\">\n      \u003cdiv class=\"row\">\n        \u003c!-- 手机端保底入口：任何手势下都能打开属性面板（桌面端隐藏，右栏本来就常显） -->\n        \u003cbutton id=\"propsBtn\" class=\"pri\" onclick=\"togglePropsSheet()\">属性\u003c/button>\n        \u003cbutton class=\"pri\" onclick=\"save()\">保存模板\u003c/button>\n        \u003cbutton onclick=\"render()\">刷新预览\u003c/button>\n        \u003cbutton onclick=\"printTest()\">打测试页\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"msg\" class=\"warn\">\u003c/div>\n      \u003cdiv class=\"hint\" style=\"margin-top:6px\">\n        保存前服务端会再校验（列越界/块数/二维码参数等），不过会给出原因且\u003cstrong>不保存\u003c/strong>。\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/div>\u003cfooter class=\"lp-footer\">\u003cspan>\u003ci class=\"lp-dot\">\u003c/i>Lucky Studio \u003cspan style=\"color:#bdc8b9\">/\u003c/span> 幸运翻页机控制台\u003c/span>\u003cspan id=\"footerMode\">本地连接 · 无需外部资源\u003c/span>\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"lp-scrim\">\u003c/div>\u003cnav class=\"lp-mobile-nav\" aria-label=\"移动端导航\">\u003ca href=\"./index.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003c/svg>\u003cspan>抽奖工作台\u003c/span>\u003c/a>\u003ca href=\"./prizes.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/>\u003cpath d=\"M5 12v9h14v-9M12 8v13M12 8C5 8 4 2 8 3c3 0 4 5 4 5Zm0 0c7 0 8-6 4-5-3 0-4 5-4 5Z\"/>\u003c/svg>\u003cspan>奖池管理\u003c/span>\u003c/a>\u003ca href=\"./receipt.html\" class=\"on\" aria-current=\"page\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 3h14v18l-3-2-4 2-4-2-3 2ZM8 8h8M8 12h8M8 16h4\"/>\u003c/svg>\u003cspan>小票设计\u003c/span>\u003c/a>\u003cbutton aria-label=\"更多导航\" aria-controls=\"lpSidebar\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 6h16M4 12h16M4 18h16\"/>\u003c/svg>\u003cspan>更多\u003c/span>\u003c/button>\u003c/nav>\u003cscript>\n// 自诊断：任何脚本错误都显示在页面上 —— 现场排障不用连电脑看控制台\nvar __shownErr={};\nfunction __showErr(text){\n  var b=document.getElementById('errbar'); if(!b) return;\n  if(__shownErr[text]) return;                 // 同一错误只提示一次，避免刷屏\n  __shownErr[text]=1;\n  b.style.display='block';\n  b.textContent=text+'（同类错误不再重复提示）';\n}\nwindow.onerror=function(m,src,line,col){ __showErr('⚠ 脚本错误: '+m+' (行 '+line+')'); return false; };\nwindow.addEventListener('unhandledrejection',function(e){\n  var r=e&&e.reason, msg=(r&&r.message)||String(r||'');\n  // 网络类抖动不吓唬用户（编辑时高频请求本就可能被取消/超时）\n  if(/abort|timed out|Failed to fetch|NetworkError|Load failed/i.test(msg)) return;\n  __showErr('⚠ 请求失败: '+msg);\n});\nconst $=s=>document.querySelector((s[0]==='#'||s[0]==='.')?s:('#'+s)); const PAPER=$('#canvas');\nlet blocks=[], params=[], sel=-1, paperCols=32, colw=14, lineh=22, mode='flow', logoInfo={w:0,h:0};\n// 缩放：手机端默认「适应宽度」（否则 32 列 × 14px = 448px 宽于手机屏，必须横向滚动）；\n// 桌面端保持 100%，即 colw=14/lineh=22 —— 这是 web_smoke.py 拖动断言（28px=2 列）的前提，\n// 绝不能在桌面端自动改，否则冒烟测试与既有手感一起坏掉。\nlet zoom=1, fitMode=true;\nconst isNarrow=()=>window.matchMedia('(max-width:760px)').matches;\n// 接口块 → 画布块（字段名归一化，缺一不可，否则保存时会丢数据）\nfunction fromServer(b){\n  const o={type:b.type, col:(b.col===undefined?0:b.col),\n           row:(b.row===undefined?-1:b.row),\n           align:b.align||'left', bold:!!b.bold, bg:!!b.bg};\n  if(b.type==='line'){ o.text=b.text||''; o.size=b.size||1; }\n  else if(b.type==='separator'){ o.sep_char=b.char||'-'; }\n  else if(b.type==='qr'){ o.text=b.content||''; o.qr_size=b.size||6; o.qr_ecc=b.ecc||49; }\n  else if(b.type==='feed'){ o.feed_lines=(b.lines===undefined?4:b.lines); }\n  return o;\n}\nconst DW=s=>[...String(s===undefined||s===null?'':s)].reduce((w,ch)=>w+(ch.codePointAt(0)\u003c128?1:2),0);\nfunction wrap(s,box){\n  s=String(s===undefined||s===null?'':s); if(DW(s)\u003c=box) return [s];\n  const out=[]; let cur='',w=0;\n  for(const ch of s){const cw=ch.codePointAt(0)\u003c128?1:2; if(w+cw>box){out.push(cur);cur='';w=0;} cur+=ch;w+=cw;}\n  out.push(cur); return out;\n}\nfunction pad(s,box,align){\n  const w=DW(s); if(w>=box) return s; const n=box-w;\n  if(align==='right') return ' '.repeat(n)+s;\n  if(align==='center'){const l=Math.floor(n/2);return ' '.repeat(l)+s+' '.repeat(n-l);}\n  return s+' '.repeat(n);\n}\n// 与固件 BuildCanvas 完全同规则：\n//   row >= 0 → 钉在绝对行；row = -1 → 跟随流式游标（自动排布）\nfunction layout(){\n  let cursor=0; const out=[];\n  for(const b of blocks){\n    const col=Math.max(0,Math.min(paperCols-1,b.col||0)), avail=paperCols-col;\n    let span=1;\n    if(b.type==='line'){\n      const box=b.size===2?Math.floor(avail/2):avail;\n      const lines=Math.max(1,wrap(b.text,Math.max(1,box)).length);\n      // ⚠ 2 倍字号每个字符高 2 行 → 占 2×行数（否则元素框太矮，大字被裁）\n      span=lines*(b.size===2?2:1);\n    }\n    else if(b.type==='qr'){\n      // 二维码实际高度 ≈ 29 模块 × 模块尺寸（与固件 RenderBanner/Hybrid 的预留一致）\n      span=Math.max(1,Math.ceil(29*(b.qr_size||6)/24));\n    }\n    else if(b.type==='logo'){\n      span=Math.max(1,Math.ceil((logoInfo.h||24)/24));   // 图片按实际高度占行\n    }\n    else if(b.type==='feed'){span=Math.max(1,b.feed_lines||0);}\n    const row=(b.row>=0)?b.row:cursor;\n    out.push({row,span,col,avail,auto:b.row\u003c0,bg:!!b.bg});\n    // 背景层不占流式行（文字才能叠在它上面）\n    if(b.bg){ if(row+span>cursor) cursor=row+span; }\n    else { cursor=row+span; }\n  }\n  return {rows:out,total:Math.max(cursor,...out.map(r=>r.row+r.span),1)};\n}\nfunction paint(){\n  document.documentElement.style.setProperty('--colw',colw+'px');\n  document.documentElement.style.setProperty('--lineh',lineh+'px');\n  PAPER.style.width=(colw*paperCols)+'px';\n  const L=layout();\n  PAPER.style.height=Math.max(lineh,(L.total+1)*lineh)+'px';\n  let ruler=''; for(let i=0;i*10\u003cpaperCols;i++) ruler+=`\u003cspan>${i*10}\u003c/span>`;\n  $('#ruler').innerHTML=ruler;\n  [...PAPER.querySelectorAll('.el')].forEach(e=>e.remove());\n  blocks.forEach((b,i)=>{\n    const pos=L.rows[i], el=document.createElement('div');\n    el.className='el '+b.type+(b.bg?' bg':'')+(i===sel?' sel':'');\n    if(pos.auto) el.title='自动排布（纵向拖动可钉住行位置）';\n    else el.title='固定在行 '+pos.row;\n    el.style.left=(pos.col*colw)+'px'; el.style.top=(pos.row*lineh)+'px';\n    el.style.width=(pos.avail*colw-2)+'px'; el.style.minHeight=(pos.span*lineh)+'px';   // 最小高度：盒子随内容自适应，绝不裁字\n    el.style.lineHeight=((b.size===2?2:1)*lineh)+'px';\n    el.style.fontSize=(Math.max(7,Math.round(13*zoom))*(b.size===2?2:1))+'px';\n    el.style.fontWeight=b.bold?'700':'400';\n    if(b.type==='line'){\n      const box=b.size===2?Math.floor(pos.avail/2):pos.avail;\n      const displayLines=wrap(b.text,Math.max(1,box)).map(l=>pad(l,Math.max(1,box),b.align||'left'));\n      const factor=b.size===2?2:1;\n      el.style.fontSize=Math.max(10,Math.round(22*zoom))*factor+'px';\n      displayLines.forEach(text=>{const row=document.createElement('div');row.style.height=(factor*lineh)+'px';\n        for(const ch of text){const glyph=document.createElement('span');glyph.className='lp-glyph';glyph.setAttribute('aria-hidden','true');glyph.textContent=ch;\n          glyph.style.width=((ch.codePointAt(0)\u003c128?1:2)*colw*factor)+'px';row.appendChild(glyph)}\n        el.appendChild(row)});\n    }else if(b.type==='separator'){ el.textContent=(b.sep_char||'-').repeat(Math.max(1,pos.avail)); }\n    else if(b.type==='qr'){ el.textContent='▩ 二维码 '+(b.text||'').slice(0,16)+'  '+(b.qr_size||6)+'号'; }\n    else if(b.type==='logo'){ el.textContent='[Logo]'; }\n    else if(b.type==='feed'){ el.textContent='走纸 '+(b.feed_lines||0)+' 行'; }\n    el.addEventListener('pointerdown',e=>startDrag(e,i,el));\n    PAPER.appendChild(el);\n  });\n}\n// ---- 缩放：适应宽度 / 手动步进 -------------------------------------------------\n// 适应宽度**按可用宽度反算列宽**（而不是先算比例再四舍五入），保证结果必然不溢出\nfunction fitCanvas(){\n  const st=$('#stage'); if(!st) return;\n  const avail=st.clientWidth-20;                    // 扣掉 #stage 左右各 10px 内边距\n  if(avail\u003c=0) return;\n  const c=Math.max(5, Math.floor(avail/paperCols));\n  fitMode=true; colw=c; zoom=c/14; lineh=Math.max(9,Math.round(22*zoom));\n  paint(); syncZoomTxt();\n}\nfunction setZoom(z,isFit){\n  fitMode=!!isFit;\n  zoom=Math.max(0.4,Math.min(1,z));                 // 上限 100%：放大只会虚化，无收益\n  colw=Math.max(5,Math.round(14*zoom)); lineh=Math.max(9,Math.round(22*zoom));\n  paint(); syncZoomTxt();\n}\nfunction zoomStep(d){ setZoom(colw/14+d,false); }\nfunction syncZoomTxt(){\n  const t=$('#zoomTxt'); if(t) t.textContent=Math.round(colw/14*100)+'%';\n}\n// 屏幕旋转/窗口变化：仍处于「适应宽度」才跟随，用户手动缩放后不打扰\nfunction autoFit(){ if(fitMode && isNarrow()) fitCanvas(); }\nwindow.addEventListener('resize',autoFit);\nwindow.addEventListener('orientationchange',function(){ setTimeout(autoFit,300); });\n\n// ---- 手机端属性抽屉：桌面端这些 class 不产生任何效果（样式全在 ≤640px 内） ----\n// ⚠ 手机端最容易踩的坑：抽屉是**底部固定**的，弹出后会盖住画布。\n// 实测（390×844）：抽屉顶边 y=339，而画布元素从 y=507 起 → 整个画布被盖住，\n// 用户看不到自己在编辑哪个元素。故：\n//   1) 只在中指**轻点**选中时弹抽屉（拖动时不弹，否则手指下就被盖一层）；\n//   2) 弹出后把**选中元素**平滑滚到抽屉上方的可见带内；\n//   3) 抽屉打开时给页面留出额外滚动空间，最底部的元素也能滚上去。\nlet sheetSel=-2;\nfunction openSheet(i){\n  document.body.classList.add('sheet-open');\n  if(i!==sheetSel){ sheetSel=i; ensureSelectedVisibleSoon(); }\n}\nfunction closeSheet(){ document.body.classList.remove('sheet-open'); sheetSel=-2; }\n// 底栏「属性」保底入口：切换抽屉显隐（手机端；桌面端按钮隐藏）\nfunction togglePropsSheet(){\n  if(sel\u003c0||!blocks[sel]){ setMsg('warn','先在画布上点选一个元素，再点「属性」'); return; }\n  if(document.body.classList.contains('sheet-open')) closeSheet(); else openSheet(sel);\n}\nfunction ensureSelectedVisibleSoon(){\n  requestAnimationFrame(function(){ setTimeout(ensureSelectedVisible,40); });\n}\nfunction ensureSelectedVisible(){\n  if(!isNarrow()) return;\n  const el=PAPER.querySelector('.el.sel'), p=$('#panels');\n  if(!el||!p||!document.body.classList.contains('sheet-open')) return;\n  const vh=document.documentElement.clientHeight;\n  const gap=parseFloat(getComputedStyle(p).bottom)||0;   // 抽屉底到视口底的距离（=底部操作栏高）\n  const sheetTop=vh-gap-p.offsetHeight;                 // offsetHeight 不含 transform，取值稳定\n  const r=el.getBoundingClientRect();\n  const pad=20;                                       // 与抽屉顶边留出可见间隙\n  let dy=0;\n  if(r.bottom>sheetTop-pad) dy=Math.ceil(r.bottom-(sheetTop-pad));   // 被抽屉压住 → 往上滚\n  else if(r.top\u003c6) dy=Math.floor(r.top-6);                            // 滚出上边 → 往下滚\n  if(dy) window.scrollBy({top:dy,behavior:'smooth'});\n}\n\nlet drag=null;\n// ⚠ 轻点抖动阈值：真手指\"点一下\"必然伴随 1~3px 抖动，会产生 pointermove。\n// 若把任何 pointermove 都当成拖动，真机上轻点就永远不会弹属性抽屉\n// （真机反馈\"点击元素没看到属性面板\"就是这个原因；而 touchscreen.tap 不产生\n//  中间 move，所以自动化测试曾漏掉它）。\nconst TAP_SLOP=6;\nfunction startDrag(e,i,el){\n  e.preventDefault(); sel=i; paint(); paintProps();   // 只高亮选中，不弹抽屉（拖动时画布要完整可见）\n  el.classList.add('dragging');                      // 触屏手指会遮住元素，给个抬升反馈\n  const L0=layout();\n  const curRow=(L0.rows[i]&&L0.rows[i].row)||0;      // 当前生效行（自动块取其流式行）\n  drag={i,x0:e.clientX,y0:e.clientY,col0:blocks[i].col||0,baseRow:curRow,moved:false};\n  const move=ev=>{\n    if(!drag) return;\n    const dx=ev.clientX-drag.x0, dy=ev.clientY-drag.y0;\n    if(!drag.moved){\n      if(Math.abs(dx)\u003cTAP_SLOP && Math.abs(dy)\u003cTAP_SLOP) return;   // 抖动 → 仍视为轻点\n      drag.moved=true;\n    }\n    // 位移一律以按下点为基准（拖动开始时固定，绝不能每帧重算，否则会累加跑飞）\n    blocks[drag.i].col=Math.max(0,Math.min(paperCols-1,drag.col0+Math.round(dx/colw)));\n    if(Math.round(dy/lineh)!==0){\n      blocks[drag.i].row=Math.max(0,Math.min(300,drag.baseRow+Math.round(dy/lineh)));\n    }\n    paint();\n  };\n  const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);\n                 document.removeEventListener('pointercancel',up);\n                 [...PAPER.querySelectorAll('.el')].forEach(x=>x.classList.remove('dragging'));\n                 const moved=drag&&drag.moved;\n                 if(moved){ paintProps(); paint(); render(); }\n                 // 轻点 → 弹抽屉（并滚到可见带）；拖动 → 不弹；抽屉已开时保持元素可见\n                 if(moved){ if(document.body.classList.contains('sheet-open')) ensureSelectedVisible(); }\n                 else if(sel>=0){ openSheet(sel); }\n                 drag=null; };\n  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);\n  document.addEventListener('pointercancel',up);     // 触屏被系统打断（来电/手势）也要收尾\n}\n// 点画布空白处 = 取消选中并收起抽屉\nPAPER.addEventListener('pointerdown',function(e){\n  if(e.target===PAPER || e.target.id==='grid'){ sel=-1; paint(); paintProps(); }\n});\nconst esc=s=>String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/\"/g,'&quot;');\nfunction paintProps(){\n  const f=$('#form'), b=blocks[sel];\n  if(!b){ $('#noSel').style.display='block'; f.style.display='none'; closeSheet(); return; }\n  $('#noSel').style.display='none'; f.style.display='block';\n  // 注意：这里**不**主动开抽屉 —— 开抽屉的时机由交互决定\n  // （轻点选中 / 新增元素才开；拖动时不开，否则手指下被盖一层）\n  const tag={line:'文字行',separator:'分隔线',qr:'二维码',logo:'Logo',feed:'走纸'}[b.type];\n  let h=`\u003cdiv class=\"hint\" style=\"margin-bottom:6px\">#${sel+1} ${tag}\n    \u003cbutton class=\"mini\" style=\"float:right\" onclick=\"del()\">删除\u003c/button>\n    \u003cbutton class=\"mini\" style=\"float:right;margin-right:4px\" onclick=\"dup()\">复制\u003c/button>\u003c/div>`;\n  if(b.type==='line'||b.type==='qr'){\n    h+=`\u003clabel>${b.type==='line'?'文字（可含 {参数}）':'二维码内容'}\u003c/label>\n        \u003ctextarea id=\"pf-text\" oninput=\"setF('text',this.value)\">${esc(b.text)}\u003c/textarea>`;\n  }\n  if(b.type==='line'){\n    h+=`\u003clabel>对齐（剩余宽度内）\u003c/label>\u003cselect onchange=\"setF('align',this.value)\">\n      ${['left','center','right'].map(a=>`\u003coption value=\"${a}\" ${b.align===a?'selected':''}>${{left:'左',center:'中',right:'右'}[a]}\u003c/option>`).join('')}\u003c/select>\n      \u003cdiv class=\"row\">\u003clabel style=\"margin:0\">字号\u003c/label>\n      \u003cselect onchange=\"setF('size',+this.value)\" style=\"width:auto\">\n        \u003coption value=\"1\" ${b.size===1?'selected':''}>1 倍\u003c/option>\u003coption value=\"2\" ${b.size===2?'selected':''}>2 倍\u003c/option>\u003c/select>\n      \u003clabel style=\"margin:0\">\u003cinput type=\"checkbox\" ${b.bold?'checked':''} onchange=\"setF('bold',this.checked)\" style=\"width:auto\"> 加粗\u003c/label>\u003c/div>`;\n  }\n  if(b.type==='separator'){ h+=`\u003clabel>填充字符\u003c/label>\u003cinput maxlength=\"1\" value=\"${esc(b.sep_char||'-')}\" oninput=\"setF('sep_char',this.value||'-')\">`; }\n  if(b.type==='qr'){\n    h+=`\u003cdiv class=\"row\">\u003clabel style=\"margin:0\">模块尺寸\u003c/label>\n      \u003cinput type=\"number\" min=\"1\" max=\"16\" value=\"${b.qr_size||6}\" style=\"width:70px\" onchange=\"setF('qr_size',+this.value)\">\n      \u003clabel style=\"margin:0\">纠错\u003c/label>\u003cselect onchange=\"setF('qr_ecc',+this.value)\" style=\"width:auto\">\n      ${[[48,'L'],[49,'M'],[50,'Q'],[51,'H']].map(([v,n])=>`\u003coption value=\"${v}\" ${b.qr_ecc===v?'selected':''}>${n}\u003c/option>`).join('')}\u003c/select>\u003c/div>`;\n  }\n  if(b.type==='feed'){ h+=`\u003clabel>走纸行数\u003c/label>\u003cinput type=\"number\" min=\"0\" max=\"10\" value=\"${b.feed_lines||0}\" onchange=\"setF('feed_lines',+this.value)\">`; }\n  if(b.type==='logo'){\n    // 图片元素：背景开关 + 就在这里上传/更换（原来必须切到 Logo 页，体验割裂）\n    h+=`\u003clabel>背景图 / Logo\u003c/label>\n        \u003cdiv class=\"hint\" id=\"logostate\">读取中…\u003c/div>\n        \u003ccanvas id=\"logothumb\" style=\"display:none;max-width:100%;border:1px solid #345;border-radius:6px;margin-top:6px;background:#fff\">\u003c/canvas>\n        \u003cdiv class=\"row\" style=\"margin-top:6px\">\n          \u003cinput type=\"file\" id=\"logofile\" accept=\"image/*\" style=\"font-size:12px\">\n        \u003c/div>\n        \u003cdiv class=\"row\">\n          \u003cbutton class=\"mini\" onclick=\"uploadLogoInline()\">上传/更换\u003c/button>\n          \u003cbutton class=\"mini\" onclick=\"deleteLogoInline()\">删除图\u003c/button>\n        \u003c/div>\n        \u003cdiv class=\"hint\">建议宽度 = 纸宽（58mm≈384 点 / 80mm≈576 点），高度上限 672 点（28 行），\n        按宽度等比缩放并转 1-bit。\u003c/div>\n        \u003clabel style=\"margin-top:8px\">\u003cinput type=\"checkbox\" ${b.bg?'checked':''}\n        onchange=\"setF('bg',this.checked)\" style=\"width:auto\"> \u003cb>作为背景层\u003c/b>（不占流式行，文字可排在它前后）\u003c/label>`;\n    setTimeout(loadLogoInline,0);\n  } else if(b.type==='qr'){\n    h+=`\u003cdiv class=\"hint\">二维码\u003cb>不能\u003c/b>做背景：文字会遮挡码点、降低扫码识别率。\u003c/div>`;\n  } else {\n    h+=`\u003cdiv class=\"hint\">只有 \u003cb>Logo\u003c/b> 可以设为背景水印。\u003c/div>`;\n  }\n  h+=`\u003cdiv class=\"row\">\u003clabel style=\"margin:0\">列位置 0..${paperCols-1}\u003c/label>\n      \u003cinput type=\"number\" min=\"0\" max=\"${paperCols-1}\" value=\"${b.col||0}\" style=\"width:80px\" onchange=\"setF('col',+this.value)\">\n      \u003clabel style=\"margin:0\">行\u003c/label>\n      \u003cinput type=\"number\" min=\"-1\" max=\"300\" value=\"${(b.row===undefined?-1:b.row)}\" style=\"width:80px\" onchange=\"setF('row',+this.value)\">\n      \u003clabel style=\"margin:0\">\u003cinput type=\"checkbox\" ${b.row\u003c0?'checked':''} onchange=\"setF('row',this.checked?-1:0)\" style=\"width:auto\"> 自动\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"hint\">左右拖动改列位置；上下拖动把元素\u003cstrong>钉在这一行\u003c/strong>。\n      \u003cb>同一行放两个元素\u003c/b>（如左店名右日期）就是给它们设相同的「行」、不同的「列」。\n      勾「自动」则回到流式排布。\u003c/div>`;\n  f.innerHTML=h;\n}\nfunction setF(k,v){ if(blocks[sel]){ blocks[sel][k]=v; paint(); render(350); if(k!=='text') paintProps(); } }\nfunction add(t){ const b={type:t,col:0};\n  if(t==='line'){b.text='新文字行';b.align='left';b.size=1;b.bold=false;}\n  if(t==='separator'){b.sep_char='-';}\n  if(t==='qr'){b.text='{ticket}{check}';b.qr_size=6;b.qr_ecc=49;}\n  if(t==='feed'){b.feed_lines=4;}\n  const at=sel>=0?sel+1:blocks.length; blocks.splice(at,0,b); sel=at; paint(); paintProps(); render();\n  openSheet(sel);   // 新增元素后直接开抽屉编辑（并把新元素滚到抽屉上方可见带）\n}\nfunction del(){ if(sel>=0){ blocks.splice(sel,1); sel=-1; paint(); paintProps(); render(); } }\nfunction dup(){ if(sel>=0){ blocks.splice(sel+1,0,JSON.parse(JSON.stringify(blocks[sel]))); sel++; paint(); paintProps(); render(); } }\nfunction setPaper(v){ paperCols=+v; blocks.forEach(b=>{ if((b.col||0)>=paperCols) b.col=paperCols-1; });\n  if(fitMode && isNarrow()) fitCanvas(); else { paint(); }\n  paintProps(); render(); }\nconst MODE_HINT = {\n  flow:  '纯文字：全部走打印机文字，帧 ~0.5KB、约 1 秒/张、行数不限，但无图无边框。',\n  canvas:'画布：整票合成位图，文字可与图逐像素叠加、四边完整边框；代价是帧 ~32KB、约 8 秒/张，且行数受图高限制。',\n  banner:'花边：只打上下两段花边，中间走文字 —— 帧 ~3~4KB、约 1.5 秒/张、行数不限；代价是画不出左右竖线。'\n};\nfunction setMode(m){\n  mode=m;\n  const b=$('#bannerrows'); if(b) b.style.display = (m==='banner')?'inline':'none';\n  const h=$('#modehint'); if(h) h.textContent = MODE_HINT[m]||'';\n  // §7.3d 每种类型各有自己的模板：切换即**加载该类型的模板**\n  loadTemplateForMode(m);\n}\nasync function loadTemplateForMode(m){\n  const idx={flow:0,canvas:1,banner:2}[m];\n  try{\n    const t=await fetch('/api/receipt/template?mode='+idx).then(r=>r.json());\n    paperCols=t.paper_cols||32; if($('#paper')) $('#paper').value=paperCols;\n    if(t.banner_top_rows!==undefined && $('#btop')) $('#btop').value=t.banner_top_rows;\n    if(t.banner_bottom_rows!==undefined && $('#bbot')) $('#bbot').value=t.banner_bottom_rows;\n    blocks=(t.blocks||[]).map(fromServer);\n    sel=-1; paint(); paintProps();\n    setMsg('ok','已载入「'+m+'」类型的模板（'+blocks.length+' 个元素）—— 改完点「保存模板」即存回该类型');\n    render(0);\n  }catch(e){ setMsg('warn','载入该类型模板失败'); }\n}\nfunction payload(extra){\n  const o0={version:3,mode:mode,paper_cols:paperCols};\n  if(mode==='banner'){\n    o0.banner_top_rows=+($('#btop')?$('#btop').value:2);\n    o0.banner_bottom_rows=+($('#bbot')?$('#bbot').value:3);\n  }\n  return Object.assign(o0,{blocks:blocks.map(b=>{\n    const o={type:b.type}; if(b.col) o.col=b.col; if(b.row>=0) o.row=b.row;\n    if(b.bg) o.bg=true;   // ⚠ 必须回传 bg：否则保存一次就丢背景层标记 →\n                          // 图变成普通图片带、文字全排到框外（真机事故）\n    if(b.type==='line'){o.text=b.text;o.align=b.align||'left';o.size=b.size||1;o.bold=!!b.bold;}\n    else if(b.type==='separator'){o.char=b.sep_char||'-';}\n    else if(b.type==='qr'){o.content=b.text;o.size=b.qr_size||6;o.ecc=b.qr_ecc||49;}\n    else if(b.type==='feed'){o.lines=b.feed_lines||0;}\n    return o;})},extra||{});\n}\n// 预览请求：**防抖 + 单飞 + 丢弃过期响应**。\n// 曾经每敲一键发一次请求（实测输入 15 字符 = 16 次请求）→ 把设备 HTTP 打爆，\n// 前端还会弹\"请求失败\"。现在：停止输入 350ms 后才发，且同一时刻只允许一个在飞。\nlet previewTimer=null, previewCtl=null, previewSeq=0;\nfunction setMsg(kind, text){\n  const m=$('#msg'); if(!m) return;\n  m.className=kind; m.textContent=text;\n}\nfunction render(delay){\n  if(delay){ clearTimeout(previewTimer); previewTimer=setTimeout(function(){ render(0); }, delay); return; }\n  clearTimeout(previewTimer);\n  const seq=++previewSeq;\n  if(previewCtl){ try{ previewCtl.abort(); }catch(e){} }\n  previewCtl=(typeof AbortController!=='undefined')?new AbortController():null;\n  const opt={method:'POST', body:JSON.stringify(payload())};\n  if(previewCtl) opt.signal=previewCtl.signal;\n  fetch('/api/receipt/template/preview', opt)\n    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })\n    .then(function(res){\n      if(seq!==previewSeq) return;                 // 过期响应丢弃\n      const d=res.d;\n      if(!res.ok){ setMsg('warn','❌ '+(d.error||'预览失败')); return; }\n      $('#preview').textContent=d.text;\n      if(d.unknown_params>0) setMsg('warn','⚠ '+d.unknown_params+' 个未知参数（会原样打印）');\n      else setMsg('ok','✅ '+d.blocks+' 个元素 · '+d.paper_cols+' 列');\n    })\n    .catch(function(e){\n      if(e && e.name==='AbortError') return;       // 被新请求取代，正常\n      if(seq!==previewSeq) return;\n      setMsg('warn','预览刷新失败（点「刷新预览」重试）');\n    });\n}\nfunction togglePreview(){ const p=$('#preview'); p.style.display=p.style.display==='block'?'none':'block'; }\nasync function save(){\n  const bad=blocks.filter(b=>b.type==='qr' && !(b.text||'').trim());\n  if(bad.length){\n    setMsg('warn','❌ 有 '+bad.length+' 个二维码没有内容 —— 二维码块必须填内容（如 {ticket}{check}），否则打印不出码');\n    return;\n  }\n  const r=await fetch('/api/receipt/template',{method:'PUT',body:JSON.stringify(payload())});\n  const d=await r.json();\n  $('#msg').className=r.ok?'ok':'warn';\n  $('#msg').textContent=r.ok?'✅ 已保存并生效':'❌ '+(d.error||'保存失败');\n}\nasync function loadDefault(){\n  if(!confirm('恢复出厂版式？当前编辑内容会丢失。'))return;\n  const p=await fetch('/api/receipt/params').then(r=>r.json());\n  const dt=p.default_template; if(!dt)return;\n  paperCols=dt.paper_cols||32; $('#paper').value=paperCols;\n  mode=dt.mode||'flow';\n  if($('#mode')) $('#mode').value=mode;\n  if($('#modehint')) $('#modehint').textContent=MODE_HINT[mode]||'';\n  blocks=(dt.blocks||[]).map(fromServer);\n  sel=-1; paint(); paintProps(); render();\n  $('#msg').textContent='已载入出厂版式，点「保存模板」生效';\n}\nasync function resetAll(){\n  if(!confirm('把三种版式（纯文字/画布/花边）全部恢复为出厂预设？\\n你自定义的版式会被覆盖。')) return;\n  const r=await fetch('/api/receipt/template/reset',{method:'POST',body:JSON.stringify({mode:-1})});\n  setMsg(r.ok?'ok':'warn', r.ok?'三种版式已全部重置为出厂预设':'❌ 重置失败');\n  if(r.ok){ mode='flow'; $('#mode').value='flow'; $('#bannerrows').style.display='none'; $('#modehint').textContent=MODE_HINT.flow; loadTemplateForMode('flow'); }\n}\nasync function printTest(){\n  // 所见即所打：把**当前画布内容**发给打印机（未保存的改动也照打）\n  const r=await fetch('/api/printer/test',{method:'POST',body:JSON.stringify(payload())});\n  const d=await r.json().catch(function(){return {};});\n  setMsg(r.ok?'ok':'warn', r.ok?('已按当前画布内容（'+blocks.length+' 个元素）发出测试页')\n                            :('发送失败：'+(d.error||''))); }\nasync function syncClock(){\n  const r=await fetch('/api/time',{method:'POST',body:JSON.stringify({epoch:Math.floor(Date.now()/1000)})});\n  if(!r.ok){ $('#msg').className='warn'; $('#msg').textContent='⚠ 校时失败，{date}/{time} 可能显示占位符'; }\n}\n// ---- Logo 图：就地读取 / 上传 / 删除（把 Logo 页的能力搬进画布）----\nasync function loadLogoInline(){\n  const st=$('#logostate'), cv=$('#logothumb');\n  if(!st) return;\n  try{\n    const info=await fetch('/api/logo').then(r=>r.ok?r.json():{exists:false});\n    logoInfo={w:info.width||0,h:info.height||0};\n    if(!info.exists){ logoInfo={w:0,h:0}; st.textContent='当前：未上传（画布上该元素不会打出图）'; if(cv) cv.style.display='none'; paint(); return; }\n    st.textContent=`当前：${info.width}×${info.height} 点（${info.bytes} B，约 ${(info.height/24).toFixed(1)} 行高）`;\n    const rr=await fetch('/api/logo/raw');\n    if(!rr.ok) return;\n    const buf=new Uint8Array(await rr.arrayBuffer());\n    if(buf.length\u003c8 || String.fromCharCode(buf[0],buf[1],buf[2],buf[3])!=='LGO1') return;\n    const w=buf[4]|(buf[5]\u003c\u003c8), h=buf[6]|(buf[7]\u003c\u003c8);\n    // 解码 1-bit 栅格画缩略图（用户能直接看到现在用的是哪张图）\n    if(cv){\n      cv.style.display='block';\n      cv.width=w; cv.height=h;\n      const ctx=cv.getContext('2d');\n      const img=ctx.createImageData(w,h);\n      const bpr=w/8;\n      for(let y=0;y\u003ch;y++)for(let x=0;x\u003cw;x++){\n        const bit=(buf[8+y*bpr+(x>>3)]>>(7-(x&7)))&1;\n        const v=bit?0:255, i=(y*w+x)*4;\n        img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255;\n      }\n      ctx.putImageData(img,0,0);\n      cv.style.maxHeight='140px';\n    }\n  }catch(e){ st.textContent='当前：读取失败'; }\n}\nasync function uploadLogoInline(){\n  const f=$('#logofile');\n  if(!f || !f.files || !f.files[0]){ setMsg('warn','请先选择一张图片文件'); return; }\n  setMsg('ok','正在压缩并上传…');\n  const url=URL.createObjectURL(f.files[0]);\n  const im=new Image();\n  im.onload=async()=>{\n    // 目标宽度 = 纸宽点数（58mm 384 / 80mm 576），上限 576；高度上限 672（设备限制）\n    const maxW=Math.min(576, paperCols*12), maxH=672;\n    let w=maxW, h=Math.round(im.height*maxW/im.width);\n    if(h>maxH){ h=maxH; w=Math.round(im.width*maxH/im.height); }\n    w=Math.max(8, w-(w%8));                       // 宽度必须是 8 的倍数\n    const c=document.createElement('canvas'); c.width=w; c.height=h;\n    const ctx=c.getContext('2d');\n    ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);\n    ctx.drawImage(im,0,0,w,h);\n    const data=ctx.getImageData(0,0,w,h).data;\n    const bpr=w/8, out=new Uint8Array(8+bpr*h);\n    out.set([0x4C,0x47,0x4F,0x31],0);\n    out[4]=w&255; out[5]=w>>8; out[6]=h&255; out[7]=h>>8;\n    for(let y=0;y\u003ch;y++)for(let x=0;x\u003cw;x++){\n      if(data[(y*w+x)*4]\u003c128) out[8+y*bpr+(x>>3)]|=0x80>>(x&7);\n    }\n    const r=await fetch('/api/logo',{method:'POST',body:out});\n    const d=await r.json();\n    setMsg(r.ok?'ok':'warn', r.ok?`✅ 图已更新 ${d.width}×${d.height}（${d.bytes} B），重新打一张即可看到`\n                                :'❌ '+(d.error||'上传失败'));\n    URL.revokeObjectURL(url);\n    loadLogoInline();\n    paint(); render(0);\n  };\n  im.onerror=()=>{ setMsg('warn','图片解码失败'); URL.revokeObjectURL(url); };\n  im.src=url;\n}\nasync function deleteLogoInline(){\n  if(!confirm('删除当前图片？使用它的版式将不再打出图。')) return;\n  const r=await fetch('/api/logo',{method:'DELETE'});\n  setMsg(r.ok?'ok':'warn', r.ok?'已删除图片':'删除失败');\n  loadLogoInline(); paint(); render(0);\n}\nfunction insertParam(key){\n  const b=blocks[sel];\n  if(!b||(b.type!=='line'&&b.type!=='qr')){\n    $('#msg').className='warn'; $('#msg').textContent='请先点选一个「文字行」或「二维码」元素'; return; }\n  b.text=(b.text||'')+'{'+key+'}'; paint(); paintProps(); render(0);\n  const ta=$('#pf-text'); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }\n}\nasync function boot(){\n  syncClock();\n  fetch('/api/logo').then(r=>r.ok?r.json():{exists:false}).then(i=>{ if(i&&i.exists){ logoInfo={w:i.width,h:i.height}; paint(); } }).catch(()=>{});\n  const [t,p]=await Promise.all([fetch('/api/receipt/template').then(r=>r.json()),\n                                 fetch('/api/receipt/params').then(r=>r.json())]);\n  paperCols=t.paper_cols||32; $('#paper').value=paperCols;\n  mode=t.mode||'flow';\n  if($('#mode')) $('#mode').value=mode;\n  if($('#bannerrows')) $('#bannerrows').style.display=(mode==='banner')?'inline':'none';\n  if(t.banner_top_rows!==undefined && $('#btop')) $('#btop').value=t.banner_top_rows;\n  if(t.banner_bottom_rows!==undefined && $('#bbot')) $('#bbot').value=t.banner_bottom_rows;\n  if($('#modehint')) $('#modehint').textContent=MODE_HINT[mode]||'';\n  blocks=(t.blocks||[]).map(fromServer);\n  params=p.params||[];\n  $('#params').innerHTML=params.map(x=>`\u003cdiv onclick=\"insertParam('${x.key}')\">\u003ccode>{${x.key}}\u003c/code>\u003cspan>${x.desc}\u003c/span>\u003c/div>`).join('');\n  paint(); render();\n  // 手机端默认适应宽度（等一帧让 CSS/字体落定后再量宽度，避免量到未布局的值）\n  if(isNarrow()){ fitCanvas(); setTimeout(fitCanvas,150); } else { syncZoomTxt(); }\n  if(isNarrow()) closeSheet();          // 初始不弹抽屉，等用户点选元素\n}\nboot();\n\u003c/script>\n\u003cscript>/* Shar stFocus=null;\n function menu(open){if(open&&typeof window.closeSheet==='function')window.closeSheet();document.body.classList.toggle('menu-open',open);menuButton.setAttribute('aria-expanded',String(open));if(open){lastFocus=document.activeElement;aside.querySelector('a').focus()}else if(lastFocus)lastFocus.focus()}\n menuButton.onclick=()=>menu(!document.body.classList.contains('menu-open'));document.querySelector('.lp-mobile-nav button').onclick=()=>menu(true);document.querySelector('.lp-scrim').onclick=()=>menu(false);\n document.addEventListener('keydown',e=>{if(!document.body.classList.contains('menu-open'))return;if(e.key==='Escape'){menu(false);return}if(e.key==='Tab'){const focusable=Array.from(aside.querySelectorAll('a,button')).filter(x=>!x.hidden&&x.getClientRects().length),first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});\n const clock=()=>{const el=document.getElementById('clock'),now=new Date();el.textContent=now.toLocaleTimeString('zh-CN',{hour12:false});el.dateTime=now.toISOString()};clock();const clockTimer=setInterval(clock,1000);\n const observed=window.fetch.bind(window);\n window.fetch=async(input,opts)=>{const path=typeof input==='string'?input:input.url;try{const r=await observed(input,opts);if(path.split('?')[0]==='/api/lottery/status')L.connection(r.ok);return r}catch(e){if(path.startsWith('/api/')&&e.name!=='AbortError')L.connection(false);throw e}};\n let probeTimer=null;if(page!=='index'){const probe=()=>{if(!document.hidden)fetch('/api/lottery/status').then(r=>L.connection(r.ok)).catch(()=>L.connection(false))};probe();probeTimer=setInterval(probe,10000)}\n function enhance(root){const props=document.getElementById('propsBtn');if(props){props.setAttribute('aria-controls','panels');props.setAttribute('aria-expanded',String(document.body.classList.contains('sheet-open')));document.getElementById('panels').setAttribute('role','region');document.getElementById('panels').setAttribute('aria-label','元素属性与参数')}root.querySelectorAll('input,select,textarea').forEach(el=>{if(el.labels&&el.labels.length||(el.getAttribute('aria-label')&&!el.dataset.lpAutoLabel))return;const row=el.closest('td,.field,.ip-row,.row');let label=el.previousElementSibling;while(label&&label.tagName!=='LABEL'&&label.tagName!=='INPUT'&&label.tagName!=='SELECT'&&label.tagName!=='TEXTAREA')label=label.previousElementSibling;if(!label||label.tagName!=='LABEL')label=row&&row.querySelector('label');el.setAttribute('aria-label',label?label.textContent.trim():row&&row.dataset.label?row.dataset.label:el.placeholder||el.id||'输入内容');el.dataset.lpAutoLabel='1'});root.querySelectorAll('.msg').forEach(el=>{if(!el.getAttribute('role'))el.setAttribute('role','status')});root.querySelectorAll('#canvas .el').forEach((el,i)=>{el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','编辑第 '+(i+1)+' 个元素：'+el.textContent.slice(0,24));if(!el.dataset.keyBound){el.dataset.keyBound='1';el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,clientX:el.getBoundingClientRect().left+2,clientY:el.getBoundingClientRect().top+2,pointerId:1}));document.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:1}))}})}})}\n enhance(document);new MutationObserver(()=>enhance(document.querySelector('.lp-content'))).observe(document.querySelector('.lp-content'),{childList:true,subtree:true});\n window.addEventListener('pagehide',()=>{clearInterval(clockTimer);clearInterval(probeTimer)});\n})();\n\u003c/script>\u003cscript>(function(){\n 'use strict';const L=window.Lucky,page=document.body.dataset.page;\n if(page==='logo'){\n  const hint=Array.from(document.querySelectorAll('.hint')).find(e=>e.textContent.includes('数值越小'));\n  if(hint)hint.textContent='阈值越大，更多像素会转为黑点。请以黑白点阵预览为准。';\n  const oldDel=window.del;window.del=async()=>{if(!await L.confirm('删除票头 Logo？','使用这张图片的小票将不再打印该 Logo，其他版式内容保持不变。','删除 Logo'))return;try{await L.api('/api/logo','DELETE');show('ok','Logo 已删除');toast('Logo 已删除');showCurrent()}catch(e){show('err','删除失败：'+e.message)}};\n }\n if(page==='calibrate'){\n  // Keep physical controls disabled until the real calibration read succeeds.\n  const controls=Array.from(document.querySelectorAll('.grid3 button,.grid4 button,#jumpBtn,.actbar button,#advBase button'));\n  const check=()=>{const available=typeof mapping!=='undefined'&&mapping.length>0&&typeof offsets!=='undefined'&&offsets.length>=mapping.length;controls.forEach(b=>b.disabled=!available);if(!available){document.getElementById('pageChip').textContent='标定数据未就绪';if(typeof mapping==='undefined'||!mapping.length){['stCur','stBase','stOff','stAct'].forEach(id=>document.getElementById(id).textContent='—')}}};check();const t=setInterval(check,800);window.addEventListener('pagehide',()=>clearInterval(t));\n }\n if(page==='receipt'){\n  const baselineTitle=document.querySelector('.lp-page-actions');\n  const badge=document.createElement('span');badge.className='lp-unsaved-tag';badge.hidden=true;badge.textContent='未保存更改';baselineTitle.appendChild(badge);\n  let baseline=null,initialized=false;\n  const snapshot=()=>{try{return JSON.stringify(payload())}catch{return null}};\n  const capture=()=>{if(!initialized&&document.getElementById('params').textContent.trim()!=='加载中…'){baseline=snapshot();initialized=true}};capture();\n  const originalSave=window.save;window.save=async()=>{try{await originalSave();const msg=document.getElementById('msg');if(msg.textContent.includes('已保存')){baseline=snapshot();badge.hidden=true;toast('小票模板已保存')}}catch(e){toast('保存失败：'+e.message,'err')}};\n  const originalLoadMode=window.loadTemplateForMode;\n  window.loadTemplateForMode=async m=>{await originalLoadMode(m);if(!document.getElementById('msg').textContent.includes('失败')){baseline=snapshot();badge.hidd
