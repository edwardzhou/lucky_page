ocks||[]).length,paper_cols:b.paper_cols||32,unknown_params:unknown})}\n if(p==='/api/printer/test')return response({ok:true,simulated:true,message:'模拟打印，不驱动硬件'});\n if(p==='/api/time'){db.wifi.time_synced=true;persist();return response({ok:true})}\n if(p==='/api/logo'){if(m==='DELETE'){db.logo=null;persist();return response({ok:true})}if(m==='POST'){const bytes=opts.body instanceof Uint8Array?opts.body:new Uint8Array(opts.body||0);if(bytes.length\u003c8||String.fromCharCode(...bytes.slice(0,4))!=='LGO1')return response({error:'无效的 LGO1 头'},400);const w=bytes[4]|bytes[5]\u003c\u003c8,h=bytes[6]|bytes[7]\u003c\u003c8;if(w%8||w\u003c8||w>576||h\u003c1||h>672||bytes.length!==8+w/8*h)return response({error:'位图尺寸或长度无效'},400);db.logo=Array.from(bytes);persist()}if(!db.logo)return response({exists:false});const v=db.logo,w=v[4]|v[5]\u003c\u003c8,h=v[6]|v[7]\u003c\u003c8;return response({exists:true,width:w,height:h,bytes:v.length,print_ms:Math.round(h*4)})}\n if(p==='/api/logo/raw')return db.logo?new Response(new Uint8Array(db.logo),{headers:{'Content-Type':'application/octet-stream'}}):response({error:'没有 Logo'},404);\n if(p==='/api/wifi'){if(m==='PUT'){if(!b.ssid)return response({error:'请输入网络名称'},400);Object.assign(db.wifi,{ssid:b.ssid,sta_connected:true,configured:true,user_disconnected:false});db.wifi.saved=[{ssid:b.ssid,has_password:!!b.password},...db.wifi.saved.filter(n=>n.ssid!==b.ssid)];persist()}if(m==='DELETE'){if(b.all)db.wifi.saved=[];else if(Number.isInteger(b.index))db.wifi.saved.splice(b.index,1);else return response({error:'需要 index 或 all 参数'},400);if(!db.wifi.saved.length)Object.assign(db.wifi,{sta_connected:false,configured:false,ssid:''});persist()}return response({...db.wifi})}\n if(p==='/api/wifi/ap'){if('ap_ssid' in b){db.wifi.ap_ssid=b.ap_ssid||'lucky-page-DEMO';db.wifi.ap_ssid_custom=!!b.ap_ssid}if('ap_pass' in b)db.wifi.ap_pass_custom=!!b.ap_pass;persist();return response({ok:true})}\n if(p==='/api/wifi/ip'){if(b.dhcp){db.wifi.ip_mode=0}else{Object.assign(db.wifi,{ip_mode:1,ip:b.ip,netmask:b.netmask,gateway:b.gateway,static_ip:b.ip,static_mask:b.netmask,static_gw:b.gateway})}persist();return response({ok:true})}\n if(p==='/api/wifi/disconnect'){db.wifi.sta_connected=false;db.wifi.user_disconnected=true;persist();return response({ok:true})}\n if(p==='/api/wifi/reconnect'){db.wifi.sta_connected=true;db.wifi.user_disconnected=false;persist();return response({ok:true})}\n if(p==='/api/wifi/scan')return response(m==='POST'?{ok:true}:{running:false,aps:[{ssid:'Lucky_Event_Studio',secure:true,rssi:-42,bars:4},{ssid:'Studio_Backup',secure:true,rssi:-63,bars:3},{ssid:'Event_Guest',secure:false,rssi:-71,bars:2}]});\n return response({error:'该接口没有模拟实现：'+p},501);\n }\n window.fetch=(input,opts)=>{const str=typeof input==='string'?input:input.url,url=new URL(str,document.baseURI);if(url.pathname.startsWith('/api/'))return route(url,opts);return originalFetch(input,opts)};\n})();\n\u003c/script>\u003c/head>\u003cbody class=\"lp-app lp-page-wifi\" data-page=\"wifi\">\u003ca class=\"lp-skip\" href=\"#main\">跳转到主要内容\u003c/a>\u003caside class=\"lp-sidebar\" id=\"lpSidebar\" aria-label=\"主导航\">\u003ca class=\"lp-brand\" href=\"./index.html\">\u003cspan class=\"lp-brand-symbol\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4\"/>\u003c/svg>\u003c/span>\u003cspan class=\"lp-brand-name\">Lucky Studio\u003csmall>幸运翻页机 · 设备控制台\u003c/small>\u003c/span>\u003c/a>\u003cdiv class=\"lp-machine\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"/>\u003cpath d=\"M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4\"/>\u003c/svg>\u003cdiv>\u003cstrong>Lucky Page Controller\u003c/strong>\u003csmall>LOCAL DEVICE WORKSPACE\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"lp-group-label\">运营工作空间\u003c/div>\u003cnav class=\"lp-nav\">\u003ca href=\"./index.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003c/svg>\u003cspan>抽奖工作台\u003c/span>\u003c/a>\u003ca href=\"./prizes.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/>\u003cpath d=\"M5 12v9h14v-9M12 8v13M12 8C5 8 4 2 8 3c3 0 4 5 4 5Zm0 0c7 0 8-6 4-5-3 0-4 5-4 5Z\"/>\u003c/svg>\u003cspan>奖池管理\u003c/span>\u003c/a>\u003ca href=\"./receipt.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 3h14v18l-3-2-4 2-4-2-3 2ZM8 8h8M8 12h8M8 16h4\"/>\u003c/svg>\u003cspan>小票设计\u003c/span>\u003c/a>\u003c/nav>\u003cdiv class=\"lp-nav-separator\">\u003c/div>\u003cdiv class=\"lp-group-label\">设备与品牌\u003c/div>\u003cnav class=\"lp-nav\">\u003ca href=\"./logo.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"3\"/>\u003ccircle cx=\"8\" cy=\"8\" r=\"1.5\"/>\u003cpath d=\"m3 17 5-5 5 5 4-4 4 4\"/>\u003c/svg>\u003cspan>品牌素材\u003c/span>\u003c/a>\u003ca href=\"./calibrate.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 3v5M5 14v7M12 3v10M12 19v2M19 3v2M19 11v10M2 8h6M9 19h6M16 5h6\"/>\u003c/svg>\u003cspan>设备标定\u003c/span>\u003c/a>\u003ca href=\"./wifi.html\" class=\"on\" aria-current=\"page\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0\"/>\u003ccircle cx=\"12\" cy=\"20\" r=\".8\"/>\u003c/svg>\u003cspan>网络连接\u003c/span>\u003c/a>\u003c/nav>\u003cdiv class=\"lp-sidebar-bottom\">\u003cdiv class=\"lp-demo-note\" id=\"demoNotice\" hidden>\u003cspan>演示环境 · 模拟设备数据\u003c/span>本次操作不会驱动设备或打印。\u003cbr>\u003cbutton id=\"resetDemo\">重置演示数据\u003c/button>\u003c/div>\u003cdiv class=\"lp-side-foot\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6ZM8 12l3 3 5-6\"/>\u003c/svg>\u003cdiv>\u003cstrong>设备本地工作空间\u003c/strong>\u003csmall>Designed for every lucky moment.\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003c/aside>\u003cdiv class=\"lp-workspace\">\u003cheader class=\"lp-topbar\">\u003cdiv class=\"lp-breadcrumb\">\u003cbutton class=\"lp-menu-button\" aria-label=\"打开导航\" aria-controls=\"lpSidebar\" aria-expanded=\"false\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 6h16M4 12h16M4 18h16\"/>\u003c/svg>\u003c/button>\u003cspan class=\"lp-breadcrumb-parent\">设备工作空间\u003c/span>\u003cspan class=\"lp-breadcrumb-slash\">/\u003c/span>\u003cspan>网络连接\u003c/span>\u003c/div>\u003cdiv class=\"lp-topright\">\u003cspan class=\"lp-connection\" id=\"connection\">\u003ci>\u003c/i>\u003cspan>连接设备中\u003c/span>\u003c/span>\u003cspan class=\"lp-topline\">\u003c/span>\u003ctime id=\"clock\">\u003c/time>\u003cspan class=\"lp-topinfo\" title=\"设备本地控制台\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 11v6M12 7v.1\"/>\u003c/svg>\u003c/span>\u003c/div>\u003c/header>\u003cmain class=\"lp-page\" id=\"main\">\u003cheader class=\"lp-page-head\">\u003cdiv>\u003cdiv class=\"lp-eyebrow\">NETWORK CONNECTION\u003c/div>\u003ch1>网络连接\u003c/h1>\u003cp class=\"lp-subtitle\">管理设备热点、WiFi 连接与自动校时。\u003c/p>\u003c/div>\u003cdiv class=\"lp-page-actions\">\u003cdiv class=\"lp-status-slot\">\u003cspan class=\"chip\" id=\"headChip\">\u003cspan class=\"dot\">\u003c/span>\u003cspan id=\"headChipText\">读取中\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003c/header>\u003cdiv class=\"lp-content\">\n\n\n\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-title\">当前状态\u003c/div>\n  \u003cdiv class=\"status-row\">\n    \u003cspan class=\"status-label\">AP 名称\u003c/span>\n    \u003cspan class=\"status-value\">\u003cspan id=\"apName\">—\u003c/span>\n      \u003cbutton class=\"small-btn\" id=\"apEditBtn\" onclick=\"toggleApEdit()\">修改\u003c/button>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"status-row\">\n    \u003cspan class=\"status-label\">AP 密码\u003c/span>\n    \u003cspan class=\"status-value\">\u003cspan id=\"apPassState\">—\u003c/span>\n      \u003cbutton class=\"small-btn\" id=\"apPassEditBtn\" onclick=\"toggleApPassEdit()\">修改\u003c/button>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"status-row\">\n    \u003cspan class=\"status-label\">STA 状态\u003c/span>\n    \u003cspan class=\"status-value\">\u003cspan id=\"staStatus\">读取中…\u003c/span>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"status-row\">\n    \u003cspan class=\"status-label\">STA IP\u003c/span>\n    \u003cspan class=\"status-value\">\u003cspan id=\"staIp\">—\u003c/span>\u003cspan class=\"ip-mode-tag\" id=\"ipModeTag\">DHCP\u003c/span>\n      \u003cbutton class=\"small-btn\" id=\"ipEditBtn\" onclick=\"toggleIpEdit()\">修改\u003c/button>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"status-row\">\n    \u003cspan class=\"status-label\">子网掩码\u003c/span>\n    \u003cspan class=\"status-value\">\u003cspan id=\"staNetmask\">—\u003c/span>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"status-row\">\n    \u003cspan class=\"status-label\">信号\u003c/span>\n    \u003cspan class=\"status-value\">\u003cspan id=\"sig\">—\u003c/span>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"status-row\">\n    \u003cspan class=\"status-label\">已连网络\u003c/span>\n    \u003cspan class=\"status-value\">\u003cspan id=\"connectedSsid\">—\u003c/span>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"status-row\">\n    \u003cspan class=\"status-label\">时间同步\u003c/span>\n    \u003cspan class=\"status-value\">\u003cspan id=\"tsync\">—\u003c/span>\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"status-row\">\n    \u003cspan class=\"status-label\">AP 客户端\u003c/span>\n    \u003cspan class=\"status-value\">\u003cspan id=\"clients\">—\u003c/span>\u003c/span>\n  \u003c/div>\n\n  \u003c!-- 改热点名（内联展开）-->\n  \u003cdiv class=\"ip-edit-area\" id=\"apEdit\" style=\"display:none\">\n    \u003cdiv class=\"ip-row\">\u003clabel for=\"apSsid\">热点名\u003c/label>\n      \u003cinput id=\"apSsid\" maxlength=\"31\" placeholder=\"1..31 字节（中文按 3 字节）\" autocomplete=\"off\">\u003c/div>\n    \u003cdiv class=\"ip-btns\">\n      \u003cbutton class=\"pri\" id=\"apSave\" onclick=\"saveAp()\">保存\u003c/button>\n      \u003cbutton class=\"mini\" id=\"apReset\" onclick=\"resetAp()\">复原默认\u003c/button>\n      \u003cbutton class=\"mini\" onclick=\"toggleApEdit()\">取消\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"note\">已连到本机热点的手机需要重新连接（抽奖不受影响）。\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 改热点密码（内联展开；密码绝不回显）-->\n  \u003cdiv class=\"ip-edit-area\" id=\"apPassEdit\" style=\"display:none\">\n    \u003cdiv class=\"ip-row\">\u003clabel for=\"apPass\">新密码\u003c/label>\n      \u003cinput id=\"apPass\" type=\"password\" maxlength=\"63\" placeholder=\"8..63 位（不要用 12345678）\"\n             autocomplete=\"new-password\">\u003c/div>\n    \u003cdiv class=\"ip-btns\">\n      \u003cbutton class=\"pri\" id=\"apPassSave\" onclick=\"saveApPass()\">保存\u003c/button>\n      \u003cbutton class=\"mini\" id=\"apPassReset\" onclick=\"resetApPass()\">复原默认\u003c/button>\n      \u003cbutton class=\"mini\" onclick=\"toggleApPassEdit()\">取消\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"note\">改完\u003cb>已连接本机热点的手机需要用新密码重连\u003c/b>（STA 与抽奖不受影响）。\n      密码不会在任何页面/接口回显；\u003cb>忘记了可用串口 \u003ccode>wifi\u003c/code> 命令查看\u003c/b>，或在此「复原默认」。\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 静态 IP / DHCP（内联展开）-->\n  \u003cdiv class=\"ip-edit-area\" id=\"ipEdit\" style=\"display:none\">\n    \u003cdiv class=\"ip-row\">\u003clabel for=\"stIp\">IP 地址\u003c/label>\n      \u003cinput id=\"stIp\" placeholder=\"如 192.168.1.100\" autocomplete=\"off\">\u003c/div>\n    \u003cdiv class=\"ip-row\">\u003clabel for=\"stMask\">子网掩码\u003c/label>\n      \u003cinput id=\"stMask\" placeholder=\"如 255.255.255.0\" autocomplete=\"off\">\u003c/div>\n    \u003cdiv class=\"ip-row\">\u003clabel for=\"stGw\">网关\u003c/label>\n      \u003cinput id=\"stGw\" placeholder=\"如 192.168.1.1\" autocomplete=\"off\">\u003c/div>\n    \u003cdiv class=\"ip-btns\">\n      \u003cbutton class=\"pri\" id=\"ipSave\" onclick=\"saveIp()\">保存\u003c/button>\n      \u003cbutton class=\"mini\" id=\"ipDhcp\" onclick=\"useDhcp()\">默认（DHCP）\u003c/button>\n      \u003cbutton class=\"mini\" onclick=\"toggleIpEdit()\">取消\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"note\">网关必须与 IP 同网段，否则会被拒绝。\u003cb>配错也不会失联\u003c/b>：热点不关，\n      手机连 \u003ccode id=\"apHintSsid\">lucky-page-XXXX\u003c/code>（密码 \u003cspan id=\"apHintPass\">默认 12345678\u003c/span>）进 192.168.4.1 改回即可。\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-title\">连接操作\u003c/div>\n  \u003cbutton class=\"action-btn primary\" id=\"scanBtn\" onclick=\"scan()\">扫描 WiFi\u003c/button>\n  \u003cbutton class=\"action-btn danger\" id=\"discBtn\" onclick=\"disconnectWifi()\" style=\"display:none\">断开 WiFi 连接\u003c/button>\n  \u003cbutton class=\"action-btn danger\" id=\"reconBtn\" onclick=\"reconnectWifi()\" style=\"display:none\">重新连接\u003c/button>\n  \u003cdiv class=\"hint\">扫描前会先断开当前连接（扫描会打断 STA），结果在下方「附近 WiFi」。\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\" id=\"savedCard\" style=\"display:none\">\n  \u003cdiv class=\"card-title\">已保存 WiFi\u003c/div>\n  \u003cdiv id=\"saved\">\u003c/div>\n  \u003cdiv class=\"note\">连不上时会自动换下一个；点「优先」把它提到最前。\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-title\">附近 WiFi\u003c/div>\n  \u003cdiv id=\"aplist\" class=\"empty-hint\">点击上方按钮扫描附近 WiFi\u003c/div>\n  \u003cdiv id=\"scmsg\" class=\"note\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-title\">手动连接\u003c/div>\n  \u003cdiv class=\"field\" style=\"margin-bottom:8px\">\n    \u003clabel for=\"ssid\">WiFi 名称（SSID）\u003c/label>\n    \u003cinput id=\"ssid\" placeholder=\"输入或粘贴 SSID\" autocomplete=\"off\">\n  \u003c/div>\n  \u003cdiv class=\"field\">\n    \u003clabel for=\"pass\">密码\u003c/label>\n    \u003cinput id=\"pass\" type=\"password\" placeholder=\"开放网络留空\" autocomplete=\"new-password\">\n  \u003c/div>\n  \u003cbutton class=\"pri block\" id=\"connManual\" onclick=\"connect()\">保存并连接\u003c/button>\n  \u003cdiv class=\"msg\" id=\"msg\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"zone-danger\">\n  \u003cdiv class=\"card-head\">危险操作\u003c/div>\n  \u003cdiv class=\"hint\">清除后设备回到「仅热点」模式，需要重新填写路由器密码（奖池/模板/标定不受影响）。\u003c/div>\n  \u003cdiv class=\"row\" style=\"margin-top:10px\">\n    \u003cbutton class=\"action-btn danger\" id=\"clearSavedBtn\" onclick=\"forget()\" style=\"display:none;margin:0\">清除所有已保存 WiFi\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"msg warn\" id=\"resetEvidence\" style=\"display:none\">\u003c/div>\n\n\u003cdiv class=\"card\" id=\"resetHint\">\n  \u003cdiv class=\"card-head\">恢复出厂网络\u003c/div>\n  \u003cdiv class=\"hint\">🔘 \u003cb>设备上的恢复按钮\u003c/b>（GPIO5）：\u003cb>长按恢复按钮 5 秒\u003c/b>恢复网络默认配置 ——\n    热点名回默认、热点密码回 \u003cb>12345678\u003c/b>、忘记所有已保存的路由器、IP 回 DHCP；\n    \u003cb>不会清掉奖池 / 小票模板 / 标定\u003c/b>。\u003c/div>\n  \u003cdiv class=\"hint\" style=\"margin-top:8px\">本机热点始终可用：\u003cb id=\"apHintSsid2\">lucky-page-XXXX\u003c/b> → \u003cb>192.168.4.1\u003c/b>\n    （密码 \u003cspan id=\"apHintPass2\">默认 12345678\u003c/span>）。即使路由器密码配错也不会失联。\u003cbr>\n    \u003cb>忘记自定义的热点密码\u003c/b>：用串口命令 \u003ccode>wifi\u003c/code> 查看，或 \u003ccode>wifi appass\u003c/code> 复原默认。\u003c/div>\n\u003c/div>\n\n\u003c/div>\u003cfooter class=\"lp-footer\">\u003cspan>\u003ci class=\"lp-dot\">\u003c/i>Lucky Studio \u003cspan style=\"color:#bdc8b9\">/\u003c/span> 幸运翻页机控制台\u003c/span>\u003cspan id=\"footerMode\">本地连接 · 无需外部资源\u003c/span>\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"lp-scrim\">\u003c/div>\u003cnav class=\"lp-mobile-nav\" aria-label=\"移动端导航\">\u003ca href=\"./index.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003c/svg>\u003cspan>抽奖工作台\u003c/span>\u003c/a>\u003ca href=\"./prizes.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/>\u003cpath d=\"M5 12v9h14v-9M12 8v13M12 8C5 8 4 2 8 3c3 0 4 5 4 5Zm0 0c7 0 8-6 4-5-3 0-4 5-4 5Z\"/>\u003c/svg>\u003cspan>奖池管理\u003c/span>\u003c/a>\u003ca href=\"./receipt.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 3h14v18l-3-2-4 2-4-2-3 2ZM8 8h8M8 12h8M8 16h4\"/>\u003c/svg>\u003cspan>小票设计\u003c/span>\u003c/a>\u003cbutton aria-label=\"更多导航\" aria-controls=\"lpSidebar\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 6h16M4 12h16M4 18h16\"/>\u003c/svg>\u003cspan>更多\u003c/span>\u003c/button>\u003c/nav>\u003cscript>\nconst $=s=>document.querySelector((s[0]==='#'||s[0]==='.')?s:('#'+s));\nconst esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;');\nconst escJs=s=>String(s==null?'':s).replace(/\\\\/g,'\\\\\\\\').replace(/'/g,\"\\\\'\");\nlet polling=null, savedCount=0, scanTimer=null, aps=[], apCustom=false, apName='', apPassCustom=false;\n\nfunction setMsg(kind,text){ if(window.showMsg) showMsg('#msg',kind,text); else { const m=$('#msg'); m.className='msg show '+(kind==='ok'?'ok':'err'); m.textContent=text; } }\n\nasync function refresh(){\n  try{\n    const d=await fetch('/api/wifi').then(r=>r.json());\n    const connected=d.sta_connected, configured=d.configured;\n    $('#apName').textContent = d.ap_ssid || '—';\n    $('#apHintSsid').textContent = d.ap_ssid || 'lucky-page-XXXX';\n    $('#apHintSsid2').textContent = d.ap_ssid || 'lucky-page-XXXX';\n    apCustom = !!d.ap_ssid_custom; apName = d.ap_ssid || '';\n    // AP 密码：绝不回显，只显示\"默认 / 已自定义\"（强制规则 9）\n    apPassCustom = !!d.ap_pass_custom;\n    const passText = apPassCustom ? '已自定义（不显示）' : '默认 12345678';\n    $('#apPassState').textContent = passText;\n    $('#apPassState').style.color = apPassCustom ? 'var(--tx)' : 'var(--tx-dim)';\n    $('#apHintPass').textContent = apPassCustom ? '已自定义' : '默认 12345678';\n    $('#apHintPass2').textContent = apPassCustom ? '已自定义' : '默认 12345678';\n    // 网络复位证据（若曾被复位过，显示次数与时间 —— 排查\"没人按却被复位\"）\n    const rc = d.net_reset_count|0;\n    if(rc > 0){\n      const ts = d.net_reset_epoch ? new Date(d.net_reset_epoch*1000).toLocaleString() : '时间未知';\n      $('#resetEvidence').style.display='';\n      $('#resetEvidence').innerHTML = `⚠ 网络配置曾被\u003cb>恢复默认 ${rc} 次\u003c/b>，最近一次：\u003cb>${ts}\u003c/b>。`+\n        `若非你主动长按恢复按钮（或串口 wifi resetnet），请把这条时间告诉我们排查。`;\n    }\n    // STA 状态：已连接（绿）/ 连接中（黄）/ 用户主动断开（黄）/ 未配置（灰）\n    const st = $('#staStatus');\n    if (d.user_disconnected) { st.textContent='已断开（凭据保留）'; st.style.color='var(--w)'; }\n    else if (connected) { st.textContent='已连接'; st.style.color='var(--g)'; }\n    else if (configured) { st.textContent='连接中…'; st.style.color='var(--w)'; }\n    else { st.textContent='未配置（仅热点）'; st.style.color='var(--tx-dim)'; }\n    $('#staIp').textContent = d.ip || '—';\n    $('#staNetmask').textContent = d.netmask || (connected ? '获取中…' : '—');\n    const isStatic = (d.ip_mode === 1);\n    $('#ipModeTag').textContent = (connected || isStatic) ? (isStatic ? '静态' : 'DHCP') : '';\n    $('#ipModeTag').className = 'ip-mode-tag' + (isStatic ? ' static' : '');\n    if(isStatic && !$('#ipEdit').dataset.open){    // 静态参数回填（编辑中不覆盖用户输入）\n      $('#stIp').value = d.static_ip || ''; $('#stMask').value = d.static_mask || '';\n      $('#stGw').value = d.static_gw || '';\n    }\n    $('#sig').textContent = connected ? `${'▮'.repeat(d.bars)}${'▯'.repeat(4-d.bars)} ${d.rssi} dBm` : '—';\n    $('#connectedSsid').textContent = d.ssid || '—';\n    $('#tsync').textContent = d.time_synced ? '✅ 已同步' : '未同步';\n    $('#clients').textContent = d.ap_clients;\n    // 主操作按钮（同 artnet：按状态决定显示哪些，文案随状态变化）\n    $('#discBtn').style.display = (connected || configured) && !d.user_disconnected ? '' : 'none';\n    $('#discBtn').textContent = connected ? '断开 WiFi 连接'\n      : (configured ? '停止连接 ' + (d.ssid || '') : '断开 WiFi 连接');\n    $('#reconBtn').style.display = d.user_disconnected ? '' : 'none';\n    const saved = d.saved||[];\n    savedCount = saved.length;\n    $('#clearSavedBtn').style.display = saved.length ? '' : 'none';\n    $('#savedCard').style.display = saved.length ? '' : 'none';\n    $('#saved').innerHTML = saved.map((n,i)=>\n      `\u003cdiv class=\"ap\">\n         \u003cdiv class=\"ap-main\">\n           \u003cspan class=\"wifi-name\">${i===0?'★ ':''}${esc(n.ssid)}${n.has_password?' 🔒':'（开放）'}\u003c/span>\n           \u003cspan class=\"ap-act\">\n             ${i!==0?`\u003cbutton class=\"mini\" onclick=\"promote('${escJs(n.ssid)}')\">优先\u003c/button>`:''}\n             \u003cbutton class=\"mini\" onclick=\"removeSaved(${i})\">删除\u003c/button>\n           \u003c/span>\n         \u003c/div>\n       \u003c/div>`).join('');\n    if(d.last_reason && String(d.last_reason)!=='none' && !connected && !d.user_disconnected){\n      setMsg('warn','上次断开原因：'+d.last_reason);\n    }\n    if(configured && !connected && !d.user_disconnected && !polling){ polling=setInterval(refresh, 3000); }\n    if((connected || d.user_disconnected) && polling){ clearInterval(polling); polling=null; }\n  }catch(e){ $('#staStatus').textContent='读取失败'; }\n}\n\n// ---- 热点名可改（学习 artnet）----\nfunction toggleApEdit(){\n  const e=$('#apEdit'), show = e.style.display==='none';\n  e.style.display = show ? '' : 'none';\n  if(show){ $('#apSsid').value = apCustom ? apName : ''; $('#apSsid').focus(); }\n}\nasync function saveAp(){\n  const v=$('#apSsid').value.trim();\n  if(!v){ setMsg('warn','热点名不能为空（要恢复默认请点「复原默认」）'); return; }\n  const r=await fetch('/api/wifi/ap',{method:'PUT',body:JSON.stringify({ap_ssid:v})});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('warn','❌ '+(d.error||'改名失败')); return; }\n  setMsg('ok','✅ 热点名已改为 '+d.ap_ssid+'（已连接的客户端需重连）');\n  $('#apEdit').style.display='none'; refresh();\n}\nasync function resetAp(){\n  if(!confirm('恢复默认热点名（lucky-page-XXXX）？')) return;\n  const r=await fetch('/api/wifi/ap',{method:'PUT',body:JSON.stringify({ap_ssid:''})});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('warn','❌ '+(d.error||'复原失败')); return; }\n  setMsg('ok','✅ 已恢复默认热点名：'+d.ap_ssid);\n  $('#apEdit').style.display='none'; refresh();\n}\n\n// ---- 热点密码可改（用户要求；密码绝不回显）----\nfunction toggleApPassEdit(){\n  const e=$('#apPassEdit'), show = e.style.display==='none';\n  e.style.display = show ? '' : 'none';\n  if(show){ $('#apPass').value=''; $('#apPass').focus(); }\n}\nasync function saveApPass(){\n  const v=$('#apPass').value;\n  if(v.length \u003c 8){ setMsg('warn','热点密码至少 8 位（WPA2 要求）'); return; }\n  const r=await fetch('/api/wifi/ap',{method:'PUT',body:JSON.stringify({ap_pass:v})});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('warn','❌ '+(d.error||'设置失败')); return; }\n  setMsg('ok','✅ 热点密码已更新（已连接热点的手机需用新密码重连）');\n  $('#apPassEdit').style.display='none'; refresh();\n}\nasync function resetApPass(){\n  if(!confirm('恢复默认热点密码（12345678）？')) return;\n  const r=await fetch('/api/wifi/ap',{method:'PUT',body:JSON.stringify({ap_pass:''})});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('warn','❌ '+(d.error||'复原失败')); return; }\n  setMsg('ok','✅ 已恢复默认热点密码 12345678');\n  $('#apPassEdit').style.display='none'; refresh();\n}\n\n// ---- 静态 IP / DHCP（学习 artnet）----\nfunction toggleIpEdit(){\n  const e=$('#ipEdit'), show = e.style.display==='none';\n  e.style.display = show ? '' : 'none';\n  if(show){ e.dataset.open='1'; refresh(); } else { delete e.dataset.open; }\n}\nasync function saveIp(){\n  const ip=$('#stIp').value.trim(), netmask=$('#stMask').value.trim(), gateway=$('#stGw').value.trim();\n  if(!ip||!netmask||!gateway){ setMsg('warn','IP / 子网掩码 / 网关都要填'); return; }\n  const r=await fetch('/api/wifi/ip',{method:'PUT',body:JSON.stringify({ip,netmask,gateway})});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('warn','❌ '+(d.error||'设置失败')); return; }\n  setMsg('ok','✅ 已切换静态 IP（重启后仍生效）');\n  toggleIpEdit(); refresh();\n}\nasync function useDhcp(){\n  const r=await fetch('/api/wifi/ip',{method:'PUT',body:JSON.stringify({dhcp:true})});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('warn','❌ '+(d.error||'切换失败')); return; }\n  setMsg('ok','✅ 已切回 DHCP（重启后仍生效）');\n  toggleIpEdit(); refresh();\n}\n\n// ---- 断开 / 重连（保留凭据；学习 artnet）----\nasync function disconnectWifi(){\n  if(!confirm('断开与路由器的连接？\\n已保存的凭据会保留，随时可再连接（热点不受影响，抽奖照常）。')) return;\n  const r=await fetch('/api/wifi/disconnect',{method:'POST'});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('warn','❌ '+(d.error||'断开失败')); return; }\n  setMsg('ok','已断开（凭据保留）；点「重新连接」即可恢复');\n  refresh();\n}\nasync function reconnectWifi(){\n  const r=await fetch('/api/wifi/reconnect',{method:'POST'});\n  const d=await r.json().catch(()=>({}));\n  if(!r.ok){ setMsg('warn','❌ '+(d.error||'重连失败')); return; }\n  setMsg('ok','已按已保存的最高优先网络发起重连…');\n  refresh();\n}\n\n// ---- 异步扫描 + 轮询（学习 artnet：不再阻塞卡 3 秒）----\nasync function scan(){\n  const btn=$('#scanBtn'); btn.disabled=true;\n  $('#scmsg').textContent='扫描中…'; $('#aplist').innerHTML='';\n  $('#aplist').className='';\n  try{\n    const r=await fetch('/api/wifi/scan',{method:'POST'});\n    const d=await r.json().catch(()=>({}));\n    if(!r.ok){ $('#scmsg').textContent='⚠ '+(d.error||'扫描失败'); btn.disabled=false; return; }\n    pollScan();\n  }catch(e){ $('#sc )}\n if(p==='/api/adjust/reset'){if(b.cell===-1)db.offsets=db.offsets.map(()=>0);else if(Number.isInteger(b.page))db.offsets[b.page]=0;persist();return response({ok:true,cleared:db.offsets.length})}\n if(p==='/api/page/goto'){if(!Number.isInteger(b.page)||b.page\u003c0||b.page>=db.pool.total_pages)return response({error:'页码越界'},400);if(db.draw)return response({error:'开奖期间不能点动'},409);db.status.current_page=b.page;persist();return response({ok:true,page:b.page})}\n if(p==='/api/receipt/template'){const mode=['flow','canvas','banner'][Number(url.searchParams.get('mode'))]||db.activeMode;if(m==='PUT'){if(!['flow','canvas','banner'].includes(b.mode)||!Array.isArray(b.blocks))return response({error:'版式无效'},400);db.templates[b.mode]=b;db.activeMode=b.mode;persist();return response({ok:true})}return response(db.templates[url.searchParams.has('mode')?mode:db.activeMode])}\n if(p==='/api/receipt/params')return response({params:[{key:'prize',desc:'奖品名称'},{key:'note',desc:'奖品副标题'},{key:'ticket',desc:'兑奖编号'},{key:'date',desc:'开奖日期'},{key:'time',desc:'开奖时间'},{key:'check',desc:'校验码'}],default_template:template('flow')});\n if(p==='/api/receipt/template/reset'){if(b.mode===-1){db.templates={flow:template('flow'),canvas:template('canvas'),banner:template('banner')};db.activeMode='flow'}persist();return response({ok:true})}\n if(p==='/api/receipt/template/preview'){let unknown=0;const last=db.status.last,values={prize:last.prize_name,note:last.prize_note,ticket:last.ticket,date:'2026-10-26',time:'10:28:36',check:'DEMO'};const text=(b.blocks||[]).map(x=>{if(x.type==='line')return String(x.text||'').replace(/\\{([^}]+)\\}/g,(all,k)=>{if(k in values)return values[k];unknown++;return all});if(x.type==='separator')return(x.char||'-').repeat(b.paper_cols||32);if(x.type==='feed')return'\\n'.repeat(Math.min(10,x.lines||0));if(x.type==='qr')return'[二维码内容：'+(x.content||'')+']';return'[Logo 点阵占位]'}).join('\\n');return response({text,blocks:(b.blocks||[]).length,paper_cols:b.paper_cols||32,unkno 。\u003cbr>\u003cbutton id=\"resetDemo\">重置演示数据\u003c/button>\u003c/div>\u003cdiv class=\"lp-side-foot\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6ZM8 12l3 3 5-6\"/>\u003c/svg>\u003cdiv>\u003cstrong>设备本地工作空间\u003c/strong>\u003csmall>Designed for every lucky moment.\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003c/aside>\u003cdiv class=\"lp-workspace\">\u003cheader class=\"lp-topbar\">\u003cdiv class=\"lp-breadcrumb\">\u003cbutton class=\"lp-menu-button\" aria-label=\"打开导航\" aria-controls=\"lpSidebar\" aria-expanded=\"false\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 6h16M4 12h16M4 18h16\"/>\u003c/svg>\u003c/button>\u003cspan class=\"lp-breadcrumb-parent\">设备工作空间\u003c/span>\u003cspan class=\"lp-breadcrumb-slash\">/\u003c/span>\u003cspan>品牌素材\u003c/span>\u003c/div>\u003cdiv class=\"lp-topright\">\u003cspan class=\"lp-connection\" id=\"connection\">\u003ci>\u003c/i>\u003cspan>连接设备中\u003c/span>\u003c/span>\u003cspan class=\"lp-topline\">\u003c/span>\u003ctime id=\"clock\">\u003c/time>\u003cspan class=\"lp-topinfo\" title=\"设备本地控制台\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 11v6M12 7v.1\"/>\u003c/svg>\u003c/span>\u003c/div>\u003c/header>\u003cmain class=\"lp-page\" id=\"main\">\u003cheader class=\"lp-page-head\">\u003cdiv>\u003cdiv class=\"lp-eyebrow\">BRAND ASSETS\u003c/div>\u003ch1>品牌素材\u003c/h1>\u003cp class=\"lp-subtitle\">管理小票票头 Logo，预览真实黑白点阵效果。\u003c/p>\u003c/div>\u003cdiv class=\"lp-page-actions\">\u003cdiv class=\"lp-status-slot\">\u003cspan class=\"chip\" id=\"logoChip\">读取中…\u003c/span>\u003c/div>\u003c/div>\u003c/header>\u003cdiv class=\"lp-content\">\n\n\n\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-head\">当前 Logo\u003c/div>\n  \u003cdiv class=\"kv\">\n    \u003cdiv class=\"kv-row\">\u003cspan class=\"k\">状态\u003c/span>\u003cspan class=\"v\" id=\"current\">读取中…\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-head\">上传与预览\u003c/div>\n  \u003cdiv class=\"field\">\n    \u003clabel for=\"file\">选择图片（PNG / JPEG）\u003c/label>\n    \u003cinput type=\"file\" id=\"file\" accept=\"image/png,image/jpeg\">\n    \u003cdiv class=\"hint\">浏览器侧转成黑白点阵，设备只收 1-bit 栅格（固件无需解码库）。\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"preview-wrap\">\n    \u003ccanvas id=\"cv\" width=\"384\" height=\"120\" style=\"display:none\">\u003c/canvas>\n    \u003cdiv class=\"empty-preview\" id=\"emptyPreview\">选择图片后在这里预览二值化效果\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"field\">\n    \u003clabel for=\"threshold\">二值化阈值\u003c/label>\n    \u003cdiv class=\"slider-row\">\n      \u003cinput type=\"range\" id=\"threshold\" min=\"1\" max=\"254\" value=\"128\" oninput=\"thv.textContent=this.value;render()\">\n      \u003cspan class=\"slider-val\" id=\"thv\">128\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"hint\">数值越小，越多像素判为黑点（图更\"实\"）。\u003c/div>\n  \u003c/div>\n  \u003clabel class=\"row\" style=\"gap:8px;margin:0\">\n    \u003cinput type=\"checkbox\" id=\"dither\" onchange=\"render()\"> Floyd–Steinberg 抖动（渐变 logo 更有层次）\n  \u003c/label>\n  \u003cdiv class=\"hint\">目标宽 384 dots（58mm 纸满宽）；建议高度 ≤96（打印 ≈0.4s）。\u003c/div>\n  \u003cdiv class=\"msg\" id=\"msg\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-head\">说明\u003c/div>\n  \u003cdiv class=\"hint\">\n    Logo 属装饰内容：上传坏数据会被拒绝；设备上 logo 损坏时自动跳过、小票照常打印。\u003cbr>\n    上传后请到 \u003ca href=\"/receipt.html\">小票\u003c/a> 打开「Logo 票头」开关。\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"zone-danger\">\n  \u003cdiv class=\"card-head\">危险操作\u003c/div>\n  \u003cdiv class=\"hint\">删除后小票不再打印票头 Logo（其他版式不受影响）。\u003c/div>\n  \u003cdiv class=\"row\" style=\"margin-top:10px\">\n    \u003cbutton class=\"danger\" onclick=\"del()\">删除 Logo\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"actbar\">\n  \u003cbutton class=\"primary block\" onclick=\"upload()\">上传并预览\u003c/button>\n\u003c/div>\n\n\u003c/div>\u003cfooter class=\"lp-footer\">\u003cspan>\u003ci class=\"lp-dot\">\u003c/i>Lucky Studio \u003cspan style=\"color:#bdc8b9\">/\u003c/span> 幸运翻页机控制台\u003c/span>\u003cspan id=\"footerMode\">本地连接 · 无需外部资源\u003c/span>\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"lp-scrim\">\u003c/div>\u003cnav class=\"lp-mobile-nav\" aria-label=\"移动端导航\">\u003ca href=\"./index.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"/>\u003c/svg>\u003cspan>抽奖工作台\u003c/span>\u003c/a>\u003ca href=\"./prizes.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/>\u003cpath d=\"M5 12v9h14v-9M12 8v13M12 8C5 8 4 2 8 3c3 0 4 5 4 5Zm0 0c7 0 8-6 4-5-3 0-4 5-4 5Z\"/>\u003c/svg>\u003cspan>奖池管理\u003c/span>\u003c/a>\u003ca href=\"./receipt.html\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 3h14v18l-3-2-4 2-4-2-3 2ZM8 8h8M8 12h8M8 16h4\"/>\u003c/svg>\u003cspan>小票设计\u003c/span>\u003c/a>\u003cbutton aria-label=\"更多导航\" aria-controls=\"lpSidebar\">\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 6h16M4 12h16M4 18h16\"/>\u003c/svg>\u003cspan>更多\u003c/span>\u003c/button>\u003c/nav>\u003cscript>\nconst $=s=>document.querySelector((s[0]==='#'||s[0]==='.')?s:('#'+s));\nlet img=null,bw=null,bh=0;\nfunction show(kind,text){\n  if(window.showMsg) showMsg('#msg',kind,text);\n  else {$('#msg').textContent=text;$('#msg').className='msg show '+(kind==='ok'?'ok':kind==='err'?'err':'warn');}\n}\n// 浏览器侧转换（D14）：固件零解码库，只收 1-bit 栅格\n$('#file').onchange=e=>{\n  const f=e.target.files[0];if(!f)return;\n  const im=new Image();\n  im.onload=()=>{img=im;$('#emptyPreview').style.display='none';$('#cv').style.display='block';render()};\n  im.src=URL.createObjectURL(f);\n};\nfunction render(){\n  if(!img)return;\n  const cv=$('#cv'),ctx=cv.getContext('2d');\n  const W=384,H=Math.min(256,Math.max(1,Math.round(img.height*W/img.width)));\n  cv.width=W;cv.height=H;cv.style.height=(H*0.8)+'px';\n  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);\n  ctx.drawImage(img,0,0,W,H);\n  const src=ctx.getImageData(0,0,W,H);\n  const th=+$('#threshold').value,dither=$('#dither').checked;\n  const err=new Float32Array(W*H);\n  for(let y=0;y\u003cH;y++)for(let x=0;x\u003cW;x++){\n    const i=(y*W+x)*4;\n    const gray=0.299*src.data[i]+0.587*src.data[i+1]+0.114*src.data[i+2]+err[y*W+x];\n    const on=gray\u003cth;                       // 暗=点（热敏打印黑点）\n    const v=on?0:255, diff=gray-v;\n    src.data[i]=src.data[i+1]=src.data[i+2]=v;\n    if(dither){\n      if(x+1\u003cW)err[y*W+x+1]+=diff*7/16;\n      if(y+1\u003cH){const r=(y+1)*W;\n        if(x>0)err[r+x-1]+=diff*3/16;\n        err[r+x]+=diff*5/16;\n        if(x+1\u003cW)err[r+x+1]+=diff*1/16;}\n    }\n  }\n  ctx.putImageData(src,0,0);\n  bw=W;bh=H;\n}\nasync function showCurrent(){\n  const r=await fetch('/api/logo');\n  const d=await r.json();\n  $('#current').textContent=d.exists?\n    `${d.width}×${d.height} dots · ${d.bytes} B · 约 ${(d.print_ms/1000).toFixed(1)}s`:\n    '未上传（默认不出票头 Logo）';\n  $('#logoChip').textContent=d.exists?'已启用':'未上传';\n  $('#logoChip').className='chip '+(d.exists?'ok':'');\n  if(!d.exists&&!img){$('#emptyPreview').style.display='flex';}\n}\nasync function upload(){\n  if(!bw){show('warn','请先选择图片');return}\n  // 打包 LGO1 头 + MSB 优先 1-bit 栅格\n  const cv=$('#cv'),ctx=cv.getContext('2d');\n  const data=ctx.getImageData(0,0,bw,bh).data;\n  const bytesPerRow=bw/8,total=8+bytesPerRow*bh;\n  const buf=new Uint8Array(total);\n  buf.set([0x4C,0x47,0x4F,0x31],0);          // \"LGO1\"\n  buf[4]=bw&255;buf[5]=bw>>8;buf[6]=bh&255;buf[7]=bh>>8;\n  for(let y=0;y\u003cbh;y++)for(let x=0;x\u003cbw;x++){\n    const gray=data[(y*bw+x)*4];\n    if(gray\u003c128)buf[8+y*bytesPerRow+(x>>3)]|=0x80>>(x&7);   // MSB 优先\n  }\n  const r=await fetch('/api/logo',{method:'POST',body:buf});\n  const d=await r.json();\n  show(r.ok?'ok':'err',r.ok?`✅ 已上传 ${d.width}×${d.height}（${d.bytes} B）`:'❌ '+(d.error||'上传失败'));\n  if(r.ok&&window.toast) toast('Logo 已上传');\n  showCurrent();\n}\nasync function del(){\n  if(!confirm('删除已上传的 Logo？\\n小票将不再打印票头 Logo。'))return;\n  await fetch('/api/logo',{method:'DELETE'});\n  show('ok','已删除');\n  if(window.toast) toast('Logo 已删除','warn');\n  showCurrent();\n}\nshowCurrent();\n\u003c/script>\n\u003cscript>/* Shared interactions; no framework or remote dependencies. */\n(function(){\n 'use strict';\n const L=window.Lucky=window.Lucky||{},icons={\"grid\": \"\u003crect x=\\\"3\\\" y=\\\"3\\\" width=\\\"7\\\" height=\\\"7\\\" rx=\\\"1.5\\\"/>\u003crect x=\\\"14\\\" y=\\\"3\\\" width=\\\"7\\\" height=\\\"7\\\" rx=\\\"1.5\\\"/>\u003crect x=\\\"3\\\" y=\\\"14\\\" width=\\\"7\\\" height=\\\"7\\\" rx=\\\"1.5\\\"/>\u003crect x=\\\"14\\\" y=\\\"14\\\" width=\\\"7\\\" height=\\\"7\\\" rx=\\\"1.5\\\"/>\", \"gift\": \"\u003crect x=\\\"3\\\" y=\\\"8\\\" width=\\\"18\\\" height=\\\"4\\\" rx=\\\"1\\\"/>\u003cpath d=\\\"M5 12v9h14v-9M12 8v13M12 8C5 8 4 2 8 3c3 0 4 5 4 5Zm0 0c7 0 8-6 4-5-3 0-4 5-4 5Z\\\"/>\", \"receipt\": \"\u003cpath d=\\\"M5 3h14v18l-3-2-4 2-4-2-3 2ZM8 8h8M8 12h8M8 16h4\\\"/>\", \"image\": \"\u003crect x=\\\"3\\\" y=\\\"3\\\" width=\\\"18\\\" height=\\\"18\\\" rx=\\\"3\\\"/>\u003ccircle cx=\\\"8\\\" cy=\\\"8\\\" r=\\\"1.5\\\"/>\u003cpath d=\\\"m3 17 5-5 5 5 4-4 4 4\\\"/>\", \"sliders\": \"\u003cpath d=\\\"M5 3v5M5 14v7M12 3v10M12 19v2M19 3v2M19 11v10M2 8h6M9 19h6M16 5h6\\\"/>\", \"wifi\": \"\u003cpath d=\\\"M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0\\\"/>\u003ccircle cx=\\\"12\\\" cy=\\\"20\\\" r=\\\".8\\\"/>\", \"arrow\": \"\u003cpath d=\\\"M5 12h14m-5-5 5 5-5 5\\\"/>\", \"refresh\": \"\u003cpath d=\\\"M20 7v5h-5M4 17v-5h5M5 7a8 8 0 0 1 13-2l2 3M4 16l2 3a8 8 0 0 0 13-2\\\"/>\", \"plus\": \"\u003cpath d=\\\"M12 5v14M5 12h14\\\"/>\", \"chip\": \"\u003crect x=\\\"6\\\" y=\\\"6\\\" width=\\\"12\\\" height=\\\"12\\\" rx=\\\"2\\\"/>\u003cpath d=\\\"M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4\\\"/>\", \"clock\": \"\u003ccircle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"9\\\"/>\u003cpath d=\\\"M12 7v5l3 2\\\"/>\", \"box\": \"\u003cpath d=\\\"m3 6 9-4 9 4v12l-9 4-9-4Zm0 0 9 4 9-4M12 10v12M7 4l10 5\\\"/>\", \"power\": \"\u003cpath d=\\\"M12 3v9M7 6a8 8 0 1 0 10 0\\\"/>\", \"menu\": \"\u003cpath d=\\\"M4 6h16M4 12h16M4 18h16\\\"/>\", \"check\": \"\u003cpath d=\\\"m5 12 4 4L20 5\\\"/>\", \"spark\": \"\u003cpath d=\\\"m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4\\\"/>\", \"printer\": \"\u003cpath d=\\\"M7 8V3h10v5M7 18H4V8h16v10h-3M7 14h10v7H7ZM17 11h.1\\\"/>\", \"shield\": \"\u003cpath d=\\\"m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6ZM8 12l3 3 5-6\\\"/>\", \"trend\": \"\u003cpath d=\\\"M4 19h16M5 14l5-5 4 3 6-8M15 4h5v5\\\"/>\", \"trash\": \"\u003cpath d=\\\"M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7\\\"/>\", \"info\": \"\u003ccircle cx=\\\"12\\\" cy=\\\"12\\\" r=\\\"9\\\"/>\u003cpath d=\\\"M12 11v6M12 7v.1\\\"/>\"};\n L.icon=n=>'\u003csvg class=\"lp-icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">'+(icons[n]||icons.grid)+'\u003c/svg>';\n L.escape=s=>String(s==null?'':s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n L.demo=!!window.LUCKY_DEMO_ACTIVE;\n L.link=n=>'./'+n+(L.demo?'?demo=1':'');\n L.connection=(ok)=>{const el=document.getElementById('connection');el.classList.toggle('offline',!ok);el.querySelector('span').textContent=ok?(L.demo?'模拟设备在线':'设备已连接'):'设备连接中断'};\n let toastTimer;\n window.toast=(text,kind)=>{let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el)}el.textContent=text;el.className='show'+(kind==='err'?' err':kind==='warn'?' warn':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='',3200)};\n window.showMsg=(id,kind,text)=>{const el=typeof id==='string'?document.getElementById(id.replace(/^#/,'')):id;if(el){el.className='msg show '+(kind==='err'?'err':kind==='warn'?'warn':'ok');el.textContent=text;el.setAttribute('role',kind==='err'?'alert':'status')}};\n window.hideMsg=id=>{const el=typeof id==='string'?document.getElementById(id.replace(/^#/,'')):id;if(el)el.className='msg'};\n L.api=async(url,method='GET',body)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const opts={method,signal:c.signal};if(body!==undefined){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(body)}const r=await fetch(url,opts);let d;try{d=await r.json()}catch{throw Error('设备响应格式错误')}if(!r.ok||d.ok===false||d.error)throw Error(d.error||'HTTP '+r.status);return d}finally{clearTimeout(t)}};\n L.confirm=(title,message,action='确认操作')=>new Promise(resolve=>{const d=document.createElement('dialog');d.className='lp-dialog';d.innerHTML='\u003ch3>'+L.escape(title)+'\u003c/h3>\u003cp>'+L.escape(message)+'\u003c/p>\u003cdiv class=\"lp-dialog-actions\">\u003cbutton value=\"cancel\">取消\u003c/button>\u003cbutton class=\"danger\" value=\"ok\">'+L.escape(action)+'\u003c/button>\u003c/div>';document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target.value)d.close(e.target.value)});d.addEventListener('close',()=>{const ok=d.returnValue==='ok';d.remove();resolve(ok)});d.showModal();d.querySelector('button').focus()});\n document.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(href.startsWith('#')||a.download)return;const u=new URL(href,document.baseURI);if(/\\.html$/.test(u.pathname)&&(!/^https?:/.test(href)||u.origin===location.origin)){const devicePage\">—\u003c/strong>\u003c/div>\u003cdiv class=\"lp-device-row\">\u003cspan>'+icon('wifi')+'网络连接\u003c/span>\u003cstrong id=\"deviceWifi\">—\u003c/strong>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"lp-shortcut-card\">\u003cdiv class=\"lp-panel-head\">\u003ch2>常用操作\u003c/h2>\u003cspan class=\"lp-caption\">QUICK ACCESS\u003c/span>\u003c/div>'+[['receipt.html','receipt','设计兑奖小票','编辑文字、二维码与品牌票头'],['logo.html','image','管理品牌素材','上传并预览黑白点阵 Logo']].map(a=>'\u003ca class=\"lp-quick-row\" href=\"'+L.link(a[0])+'\">'+icon(a[1])+'\u003cspan>'+a[2]+'\u003csmall>'+a[3]+'\u003c/small>\u003c/span>\u003cspan class=\"lp-arrow\">'+icon('arrow')+'\u003c/span>\u003c/a>').join('')+'\u003c/section>\u003c/aside>\u003c/div>';\n function number(id,n){$(id).textContent=typeof n==='number'&&Number.isFinite(n)?n.toLocaleString():'—'}\n function paintStatus(){const s=S.status||{},ready=S.online&&(s.state==='idle'||s.state==='done'),moving=['spinning','printing','homing','boot'].includes(s.state);number('totalDraws',s.stats&&s.stats.total_draws);number('todayDraws',s.stats&&s.stats.today_draws);$('startDraw').disabled=!ready||S.busy;$('testPrinter').disabled=!S.online;$('startDraw').querySelector('span').textContent=S.busy||moving?'正在处理…':'开始抽奖';$('drawState').className='chip '+(!S.online?'bad':ready?'ok':moving?'warn':'bad');$('drawState').querySelector('span').textContent=!S.online?'设备离线':states[s.state]||s.state||'状态未知';$('deviceState').textContent=S.online?(states[s.state]||s.state):'连接中断';$('devicePage').textContent=S.online&&Number.isInteger(s.current_page)?'第 '+(s.current_page+1)+' 页':'—';$('printerFault').classList.toggle('show',S.online&&!!s.printer_fault);$('printerState').textContent=!S.online?'—':s.printer_fault?'异常，请检查':s.state==='printing'?'正在打印':s.last&&s.last.print==='failed'?'上次打印失败':'未报告故障';$('drawScene').classList.toggle('is-moving',S.online&&moving);$('drawReadyText').textContent=!S.online?'设备未连接':ready?'设备已就绪，随时开启幸运':states[s.state]||'请等待设备就绪';\n const last=s.last||{},key=JSON.stringify([last.ticket,last.prize_name,last.time,last.print,s.state,S.online]);if(key!==S.lastKey){S.lastKey=key;const prize=last.ticket?String(last.prize_name||'开奖结果'):'准备开奖';const chars=Array.from(prize).slice(0,4);while(chars.length\u003c4)chars.push(' ');$('flapBoard').innerHTML=chars.map(c=>'\u003cdiv class=\"lp-flap\">\u003cspan>'+esc(c)+'\u003c/span>\u003c/div>').join('');$('drawCaption').textContent=moving?(states[s.state]||'处理中'):last.ticket?'上次开奖：'+String(last.prize_name||'开奖结果')+' · 等待新一轮幸运':'每一次翻页，都值得期待';$('lastResult').innerHTML=last.ticket?'\u003cdiv class=\"lp-ticket-prize\">'+esc(last.prize_name||'中奖结果')+'\u003c/div>\u003cdiv class=\"lp-ticket-note\">'+esc(last.prize_note||'感谢参与，祝您好运常伴')+'\u003c/div>\u003cdiv class=\"lp-ticket-rule\">\u003c/div>\u003cdiv class=\"lp-ticket-code\">NO. '+esc(last.ticket)+'\u003c/div>\u003cdiv class=\"lp-ticket-time\">'+esc(last.time||'设备未提供时间')+'\u003c/div>':'\u003cdiv class=\"lp-ticket-empty\">等待第一份幸运\u003c/div>';$('lastPrintState').innerHTML='\u003ci class=\"lp-dot\">\u003c/i>'+(last.ticket?last.print==='ok'?'设备报告：已打印':last.print==='failed'?'设备报告：打印失败':'等待设备打印状态':'结果摘要 · 非实际票面')}\n }\n function paintPool(){const p=S.pool;if(!p){$('poolRows').innerHTML='\u003ctr>\u003ctd colspan=\"4\" class=\"lp-error-inline\">奖池读取失败，请刷新重试。\u003c/td>\u003c/tr>';number('activeTiers',null);number('limitedStock',null);$('poolPolicy').textContent='耗尽策略未读取';return}const tiers=p.tiers||[],active=tiers.filter(t=>t.weight>0&&(t.quantity\u003c0||t.remaining>0));number('activeTiers',active.length);number('limitedStock',tiers.filter(t=>t.quantity>=0).reduce((n,t)=>n+Math.max(0,Number(t.remaining)||0),0));$('poolCount').textContent=tiers.length+' 个奖级';$('poolPolicy').textContent=p.depletion_policy===1?'奖品耗尽后：停止开奖':'奖品耗尽后：回退“谢谢参与”';const key=JSON.stringify(tiers);if(key===S.poolKey)return;S.poolKey=key;$('poolRows').replaceChildren();tiers.slice(0,6).forEach(t=>{const ended=t.quantity>=0&&t.remaining\u003c=0,disabled=t.weight\u003c=0,tr=document.createElement('tr');tr.innerHTML='\u003ctd>\u003cdiv class=\"lp-prize-cell\">\u003cspan class=\"lp-prize-icon\">'+icon('gift')+'\u003c/span>\u003cspan>\u003cspan class=\"lp-prize-name\">'+esc(t.name)+'\u003c/span>\u003cspan class=\"lp-prize-note\">'+esc(t.note||'第 '+(t.page+1)+' 页')+'\u003c/span>\u003c/span>\u003c/div>\u003c/td>\u003ctd>'+(t.quantity\u003c0?'不限量':esc(t.remaining)+' / '+esc(t.quantity))+'\u003c/td>\u003ctd>'+((Number(t.probability)||0)*100).toFixed(1)+'%\u003c/td>\u003ctd>\u003cspan class=\"lp-pool-status'+(ended||disabled?' finished':'')+'\">\u003ci>\u003c/i>'+(ended?'已发完':disabled?'权重为零':'可开奖')+'\u003c/span>\u003c/td>';$('poolRows').appendChild(tr)});if(!tiers.length)$('poolRows').innerHTML='\u003ctr>\u003ctd colspan=\"4\" class=\"lp-error-inline\">奖池为空，请先配置奖级。\u003c/td>\u003c/tr>'}\n async function poll(){if(S.pending||document.hidden)return;S.pending=true;try{S.status=await L.api('/api/lottery/status');S.online=true;L.connection(true);$('connectionError').classList.remove('show');paintStatus();if(S.status.state==='done'&&S.completedTicket!==(S.status.last||{}).ticket){S.completedTicket=(S.status.last||{}).ticket;loadPool()}}catch(e){S.online=false;L.connection(false);$('connectionError').classList.add('show');paintStatus()}finally{S.pending=false}}\n async function loadPool(){try{S.pool=await L.api('/api/prizes')}catch{S.pool=null}paintPool()}\n async function load(){const refresh=$('refreshWorkspace');refresh.disabled=true;await Promise.allSettled([poll(),loadPool(),L.api('/api/wifi').then(d=>{S.wifi=d;$('deviceWifi').textContent=d.sta_connected?(d.ssid||'已连接 WiFi'):'设备热点模式'}).catch(()=>{$('deviceWifi').textContent='信息不可用'})]);refresh.disabled=false}\n $('startDraw').onclick=async()=>{if(S.busy||!S.online)return;S.busy=true;paintStatus();try{const d=await L.api('/api/draw','POST');if(d.status==='busy')toast('设备正忙，请稍后','warn');else if(d.status==='error')throw Error(d.message||'开奖请求失败');await poll()}catch(e){toast('开奖失败：'+e.message,'err')}finally{S.busy=false;paintStatus()}};\n $('testPrinter').onclick=async()=>{const b=$('testPrinter');b.disabled=true;try{await L.api('/api/printer/test','POST');toast(L.demo?'演示：已模拟打印测试票':'已发送测试票打印请求')}catch(e){toast(e.message,'err')}finally{b.disabled=false}};\n $('retryConnection').onclick=load;$('refreshWorkspace').onclick=load;load();const timer=setInterval(poll,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});window.addEventListener('pagehide',()=>clearInterval(timer));\n})();\n\u003c/script>\u003c/body>\u003c/html>", "prizes.html": "\u003c!DOCTYPE html>\u003chtml lang=\"zh-CN\">\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n\n\u003cstyle>\n/* 页面特有样式；通用骨架与组件统一走 app.css */\n#tiers input{width:100%}\n.dep{opacity:.55}\n.dep td:first-child{text-decoration:line-through}\n/* 基础设置：两个字段并排，手机上自动堆叠 */\n.setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}\n.setting-grid .field{margin-bottom:8px}\n.setting-grid .row{margin:0}\n@media(max-width:640px){.setting-grid{grid-template-columns:1fr}}\n/* 库存归零的行给一个明确的\"已发完\"标记 */\n.tag-done{font-size:11px;color:#ff9a9d;border:1px solid rgba(229,72,77,.4);\n  border-radius:999px;padding:1px 6px;margin-left:4px;white-space:nowrap}\n\u003c/style>\n\u003c!-- 统一样式（设计系统 v2）：必须在各页内联样式之后 -->\n\n\u003cstyle>/* Lucky Studio · shared interface system · no external assets */\n:root{color-scheme:light;--bg:#f5f7f6;--surface:#fff;--surface-2:#f1f5f3;--inset:#f8faf9;--border:#e5ebe7;--border-strong:#d5dfd9;--tx:#20352d;--tx-dim:#61736a;--tx-mute:#7c8a83;--brand:#eb613d;--brand-dark:#d74d2b;--forest:#194638;--ok:#268464;--warn:#a66b1e;--danger:#c94545;--info:#2e7261;--p:var(--brand);--p-dark:var(--brand-dark);--g:var(--ok);--w:var(--warn);--card:var(--surface);--field:var(--inset);--bd:var(--border-strong);--chip:var(--surface-2);--chip-hover:#e8f0ec;--r-card:14px;--r-ctl:7px;--r-pill:9
